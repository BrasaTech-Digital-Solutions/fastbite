<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${subject}">FastBite</title></head>
<body style="margin:0;padding:0;background:#f3f1ea;font-family:Arial,Helvetica,sans-serif;color:#1c3029"><div style="display:none;max-height:0;overflow:hidden;opacity:0" th:text="${preheader}"></div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f1ea"><tr><td align="center" style="padding:24px 12px"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border:1px solid #dedfd5;border-radius:13px"><tr><td style="padding:28px 28px 16px"><table role="presentation" cellspacing="0" cellpadding="0"><tr><td style="background:#d64d2d;color:#ffffff;border-radius:8px;padding:4px 9px;font-family:Georgia,serif;font-size:25px;font-style:italic;font-weight:bold">f.</td><td style="padding-left:10px;font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:bold;color:#1c3029">fastbite</td></tr></table></td></tr>
<tr><td style="padding:12px 28px 28px"><h1 style="font-size:24px;line-height:1.25;margin:0 0 20px;color:#1c3029" th:text="${heading}"></h1><div th:replace="${content}"></div><table th:if="${link != null}" role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:24px 0"><tr><td align="center" style="background:#d64d2d;border-radius:7px"><a th:href="${link}" th:text="${buttonLabel}" style="display:block;padding:16px 20px;color:#ffffff;font-weight:bold;text-decoration:none">Open</a></td></tr></table><p th:if="${link != null}" th:text="${fallbackLabel}" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#58655e;margin:0 0 8px"></p><div th:if="${link != null}" style="background:#f3f1ea;padding:14px;border-radius:6px;font-family:monospace;font-size:13px;word-break:break-all"><a th:href="${link}" th:text="${link}" style="color:#1c3029"></a></div></td></tr>
<tr><td style="border-top:1px solid #dedfd5;padding:24px 28px;color:#58655e;font-size:12px;line-height:1.6"><p th:text="${reason}"></p><p><span th:text="${company}"></span><br><span th:text="${address}"></span></p><a th:href="${privacyUrl}" th:text="${privacyLabel}" style="color:#58655e"></a></td></tr></table></td></tr></table></body></html>
