spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        multi_tenancy: SCHEMA

image:
  upload:
    directory: target/test-uploads

fastbite.migrations.mode: migrate

fastbite:
  tables:
    qr:
      brake-threshold: 3
      brake-window-minutes: 10
