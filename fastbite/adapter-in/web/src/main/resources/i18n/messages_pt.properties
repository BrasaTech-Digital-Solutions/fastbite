home.verifactu.deadlines.desc=1 de janeiro de 2027 para contribuintes de IRC; 1 de julho de 2027 para os restantes (incluindo trabalhadores independentes).
home.verifactu.territory=Âmbito territorial: válido para o território comum de Espanha. Não disponível para o País Basco (TicketBAI), Navarra, Canárias (IGIC), Ceuta ou Melilla.
