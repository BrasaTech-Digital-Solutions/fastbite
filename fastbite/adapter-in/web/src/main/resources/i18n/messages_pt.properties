home.faq.eyebrow=ALGUMAS DÚVIDAS FREQUENTES
home.faq.title=Antes de abrir<br>as portas.
home.faq.q1=O que acontece após o teste gratuito?
home.faq.a1=O período de teste dura 30 dias a partir do registo. Não haverá qualquer cobrança automática. Subscreva para continuar a aceitar novos pedidos. Se não o fizer, pode consultar e exportar os seus dados na mesma.
home.faq.q2=Preciso de cartão de crédito para começar?
home.faq.a2=Não. Experimente todo o fluxo primeiro. Se ativar a subscrição antes do fim do teste, a faturação começará de imediato.
home.faq.q3=As taxas de pagamento estão incluídas?
home.faq.a3=As taxas de processamento de pagamentos e impostos são cobradas à parte. O FastBite não cobra comissões próprias por pedido.
home.faq.q4=Posso usar o meu tablet ou computador atual?
home.faq.a4=O FastBite funciona no navegador de qualquer dispositivo conectado. Teste os seus aparelhos durante o período de teste.
home.faq.q5=Posso gerir vários locais?
home.faq.a5=Sim. Cada local tem a sua própria ementa, equipa, período de teste e subscrição, geridos a partir da consola central.
home.faq.q6=Posso levar os meus dados se decidir sair?
home.faq.a6=Sim. A exportação de dados está incluída a qualquer momento através da cópia de segurança na consola de proprietário.
