home.faq.eyebrow=RESOLVEMOS TUS DUDAS
home.faq.title=Antes de abrir<br>las puertas.
home.faq.q1=¿Qué pasa al terminar la prueba gratuita?
home.faq.a1=La prueba dura 30 días desde el registro. No se te cobrará automáticamente. Si decides suscribirte, podrás seguir atendiendo nuevos pedidos. Si no, podrás seguir consultando y exportando tus datos.
home.faq.q2=¿Necesito tarjeta de crédito para empezar?
home.faq.a2=No. Puedes probar todas las funciones libremente. Si decides activar la suscripción antes de que acabe la prueba, el cobro empezará entonces.
home.faq.q3=¿Están incluidas las comisiones de pago?
home.faq.a3=Las comisiones bancarias y de pasarelas de pago se pagan directamente a los proveedores correspondientes. FastBite no añade ninguna comisión por pedido.
home.faq.q4=¿Puedo usar mis tablets o pantallas actuales?
home.faq.a4=FastBite funciona directamente en cualquier navegador web en ordenadores, tabletas y móviles. Puedes probar tus propios dispositivos durante los 30 días gratuitos.
home.faq.q5=¿Puedo gestionar varios locales?
home.faq.a5=Sí. Cada local tiene su propia carta, equipo, prueba y suscripción independiente, accesibles desde una misma cuenta. Para 3 o más locales, solicita presupuesto de grupo.
home.faq.q6=¿Puedo llevarme mis datos si decido marcharme?
home.faq.a6=Sí. Puedes descargar una copia de seguridad completa con todos tus datos en cualquier momento desde la consola de propietario.
