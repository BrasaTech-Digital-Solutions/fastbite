home.faq.eyebrow=A FEW THINGS YOU MIGHT WONDER
home.faq.title=Before you<br>open the doors.
home.faq.q1=What happens after the free trial?
home.faq.a1=Your trial lasts 30 days from registration. You won’t be charged automatically. Subscribe to continue taking new orders. Otherwise, you can still manage existing orders and export your data.
home.faq.q2=Do I need a card to get started?
home.faq.a2=No. Try the full workflow first. Activating a paid subscription before the trial ends starts billing immediately; checkout shows what you’ll pay.
home.faq.q3=Are payment fees included?
home.faq.a3=Payment-processing fees and applicable taxes are separate. FastBite does not add its own per-order commission.
home.faq.q4=Can I use my existing tablet or computer?
home.faq.a4=FastBite runs in a web browser on a connected device. Test your devices during the trial. Dedicated receipt printers, cash drawers and offline operation are not included.
home.faq.q5=Can I add more locations?
home.faq.a5=Yes. Each has its own menu, team, trial and subscription, managed from one owner console. For three or more locations, request a volume quote before subscribing. Billing is currently per location.
home.faq.q6=Can I take my data with me?
home.faq.a6=Yes. Data export is included, even after your trial or subscription ends. Download your restaurant backup from the owner console.
