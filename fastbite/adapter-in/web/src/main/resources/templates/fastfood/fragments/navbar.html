<th:block th:fragment="navbar(activeTab)" xmlns:sec="http://www.w3.org/1999/xhtml">
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center" th:href="${tenantId != null ? '/' + tenantId + '/menu' : '/menu'}">
                <div class="bg-white rounded-circle p-1 me-2 shadow-sm">
                    <i class="fas fa-hamburger text-primary"></i>
                </div>
                <span class="fw-800" th:text="#{logo.title}">FastBite</span>
            </a>
            
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <!-- Center Links: Role-based -->
                <ul th:if="${param.preview == null}" class="navbar-nav mx-auto mb-2 mb-lg-0 gap-2" sec:authorize="isAuthenticated()">
                    <!-- Menu Link (Everyone) -->
                    <li class="nav-item">
                        <a class="nav-link px-3 rounded-pill" th:href="${tenantId != null ? '/' + tenantId + '/menu' : '/menu'}" 
                           th:classappend="${activeTab == 'menu' ? 'active glass-bg' : ''}">
                            <i class="fas fa-utensils me-1"></i> <span th:text="#{staff.nav.menu}">Menu</span>
                        </a>
                    </li>
                    
                    <!-- Dashboard Link (Staff) -->
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'MANAGER', 'CASHIER', 'COOK', 'WAITER')">
                        <a class="nav-link px-3 rounded-pill" th:href="${tenantId != null ? '/' + tenantId + '/dashboard' : '/dashboard'}" 
                           th:classappend="${activeTab == 'dashboard' ? 'active glass-bg' : ''}">
                            <i class="fas fa-tachometer-alt me-1"></i> <span th:text="#{staff.nav.kitchen}">Kitchen</span>
                        </a>
                    </li>
                    
                    <!-- Counter Link (Staff) -->
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'MANAGER', 'CASHIER', 'COOK', 'WAITER')">
                        <a class="nav-link px-3 rounded-pill" th:href="${tenantId != null ? '/' + tenantId + '/counter' : '/counter'}" 
                           th:classappend="${activeTab == 'counter' ? 'active glass-bg' : ''}">
                            <i class="fas fa-cash-register me-1"></i> <span th:text="#{staff.nav.counter}">Counter</span>
                        </a>
                    </li>

                    <!-- Tickets issued (Staff who take payments) -->
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'MANAGER', 'CASHIER', 'WAITER')">
                        <a class="nav-link px-3 rounded-pill" th:href="${tenantId != null ? '/' + tenantId + '/counter/tickets' : '/counter/tickets'}"
                           th:classappend="${activeTab == 'tickets' ? 'active glass-bg' : ''}">
                            <i class="fas fa-receipt me-1"></i> <span th:text="#{staff.nav.tickets}">Tickets</span>
                        </a>
                    </li>
                    
                    <!-- BackOffice Link (Admin/Manager) -->
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'MANAGER')">
                        <a class="nav-link px-3 rounded-pill" th:href="${tenantId != null ? '/' + tenantId + '/backoffice' : '/backoffice'}" 	
                           th:classappend="${activeTab == 'backoffice' ? 'active glass-bg' : ''}">
                            <i class="fas fa-user-shield me-1"></i> <span th:text="#{staff.nav.backoffice}">Management</span>
                        </a>
                    </li>
                </ul>

                <!-- Right Side: User Info & Actions -->
                <div class="navbar-nav ms-auto align-items-center gap-3">
                    <!-- Cart Button (Only on Menu page) -->
                    <button th:if="${activeTab == 'menu'}" 
                            class="btn btn-glass position-relative py-2 px-3 rounded-pill shadow-sm" id="navBarCheckoutBtn">
                        <i class="fas fa-shopping-basket me-1"></i>
                        <span class="d-none d-sm-inline" th:text="#{label.cart}">Cart</span>
                        <span class="cart-badge bg-white text-primary fw-bold ms-2" id="cartCount">0</span>
                    </button>

                    <!-- Kitchen Audio Chime Toggle (Staff on Dashboard/Counter) -->
                    <button th:if="${activeTab == 'dashboard' || activeTab == 'counter'}" 
                            class="btn btn-glass py-2 px-3 rounded-pill shadow-sm d-flex align-items-center" 
                            id="kitchenAudioToggleBtn" type="button" th:title="#{kitchen.audio.toggle}"
                            th:data-tap-to-enable="#{kitchen.audio.tapToEnable}"
                            th:data-text-on="#{kitchen.audio.on}"
                            th:data-text-off="#{kitchen.audio.off}"
                            onclick="toggleKitchenAudio()">
                        <i class="fas fa-bell-slash me-1" id="kitchenAudioIcon"></i>
                        <span class="d-none d-md-inline small fw-bold" id="kitchenAudioText" th:text="#{kitchen.audio.off}">Chime Off</span>
                    </button>

                    <!-- User Profile & Logout -->
                    <div th:if="${param.preview == null}" class="nav-item dropdown" sec:authorize="isAuthenticated()">
                        <a class="nav-link dropdown-toggle glass-bg px-3 py-1 rounded-pill d-flex align-items-center" 
                           href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-user-circle me-2"></i>
                            <span class="small fw-bold" sec:authentication="name">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-4 mt-2" aria-labelledby="userDropdown">
                            <li class="px-3 py-2 border-bottom">
                                <div class="d-flex align-items-center">
                                    <div class="bg-light rounded-circle p-2 me-2">
                                        <i class="fas fa-user text-primary"></i>
                                    </div>
                                    <div>
                                        <div class="small fw-bold" sec:authentication="name">Username</div>
                                        <div class="smaller text-muted" sec:authorize="hasRole('OWNER')" th:text="#{label.role.owner}">Restaurant owner</div>
                                    </div>
                                </div>
                            </li>
                            <li sec:authorize="hasRole('OWNER')">
                                <a class="dropdown-item py-2" th:href="@{/owner/console(location=${tenantId})}">
                                    <i class="fas fa-store me-2" aria-hidden="true"></i> <span th:text="#{label.ownerWorkspace}">Owner workspace</span>
                                </a>
                            </li>
                            <li>
                                <form th:action="${tenantId != null ? '/' + tenantId + '/logout' : '/logout'}" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item py-2 text-danger">
                                        <i class="fas fa-sign-out-alt me-2"></i> <span th:text="#{button.logout}">Logout</span>
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>

                    <!-- Login Button (Not Authenticated) -->
                    <a sec:authorize="!isAuthenticated()" th:href="${tenantId != null ? '/' + tenantId + '/login' : '/login'}" 	
                       class="btn btn-outline-light rounded-pill px-4 shadow-sm">
                        <i class="fas fa-sign-in-alt me-2"></i> <span th:text="#{button.login}">Login</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>
</th:block>


<!-- Shared native navigation for staff pages. The Bootstrap navigation above remains for pages pending migration. -->
<header th:fragment="staff(activeTab)" class="topbar topbar-menu topbar-staff" xmlns:sec="http://www.w3.org/1999/xhtml">
    <div class="topbar-inner">
        <a class="topbar-brand" th:href="${tenantId != null ? '/' + tenantId + '/menu' : '/menu'}">
            <span class="topbar-logo"><svg class="icon" aria-hidden="true"><use href="#i-logo"></use></svg></span>
            <span class="topbar-name" th:text="${restaurantName} ?: #{logo.title}">FastBite</span>
        </a>
        <button type="button" class="topbar-toggle" aria-expanded="false" aria-controls="navbarContent" data-topbar-toggle th:aria-label="#{guest.nav.toggle}">
            <svg class="icon" aria-hidden="true"><use href="#i-bars"></use></svg>
        </button>
        <div class="topbar-content" id="navbarContent">
            <ul th:if="${param.preview == null}" class="topbar-links" sec:authorize="isAuthenticated()">
                <li><a class="topbar-link" th:classappend="${activeTab == 'menu' ? 'is-active' : ''}" th:attr="aria-current=${activeTab == 'menu' ? 'page' : null}" th:href="${tenantId != null ? '/' + tenantId + '/menu' : '/menu'}"><svg class="icon" aria-hidden="true"><use href="#i-utensils"></use></svg> <span th:text="#{staff.nav.menu}">Menu</span></a></li>
                <li sec:authorize="hasAnyRole('ADMIN', 'MANAGER', 'CASHIER', 'COOK', 'WAITER')"><a class="topbar-link" th:classappend="${activeTab == 'dashboard' ? 'is-active' : ''}" th:attr="aria-current=${activeTab == 'dashboard' ? 'page' : null}" th:href="${tenantId != null ? '/' + tenantId + '/dashboard' : '/dashboard'}"><svg class="icon" aria-hidden="true"><use href="#i-gauge"></use></svg> <span th:text="#{staff.nav.kitchen}">Kitchen</span></a></li>
                <li sec:authorize="hasAnyRole('ADMIN', 'MANAGER', 'CASHIER', 'COOK', 'WAITER')"><a class="topbar-link" th:classappend="${activeTab == 'counter' ? 'is-active' : ''}" th:attr="aria-current=${activeTab == 'counter' ? 'page' : null}" th:href="${tenantId != null ? '/' + tenantId + '/counter' : '/counter'}"><svg class="icon" aria-hidden="true"><use href="#i-register"></use></svg> <span th:text="#{staff.nav.counter}">Counter</span></a></li>
                <li sec:authorize="hasAnyRole('ADMIN', 'MANAGER', 'CASHIER', 'WAITER')"><a class="topbar-link" th:classappend="${activeTab == 'tickets' ? 'is-active' : ''}" th:attr="aria-current=${activeTab == 'tickets' ? 'page' : null}" th:href="${tenantId != null ? '/' + tenantId + '/counter/tickets' : '/counter/tickets'}"><svg class="icon" aria-hidden="true"><use href="#i-receipt"></use></svg> <span th:text="#{staff.nav.tickets}">Tickets</span></a></li>
                <li sec:authorize="hasAnyRole('ADMIN', 'MANAGER')"><a class="topbar-link" th:classappend="${activeTab == 'backoffice' ? 'is-active' : ''}" th:attr="aria-current=${activeTab == 'backoffice' ? 'page' : null}" th:href="${tenantId != null ? '/' + tenantId + '/backoffice' : '/backoffice'}"><svg class="icon" aria-hidden="true"><use href="#i-shield-user"></use></svg> <span th:text="#{staff.nav.backoffice}">Management</span></a></li>
            </ul>
            <div class="topbar-actions">
                <button th:if="${activeTab == 'dashboard' || activeTab == 'counter'}" class="topbar-cart" id="kitchenAudioToggleBtn" type="button" th:title="#{kitchen.audio.toggle}" th:data-tap-to-enable="#{kitchen.audio.tapToEnable}" th:data-text-on="#{kitchen.audio.on}" th:data-text-off="#{kitchen.audio.off}" onclick="toggleKitchenAudio()">
                    <svg class="icon" id="kitchenAudioIcon" aria-hidden="true"><use href="#i-bell-off"></use></svg> <span id="kitchenAudioText" th:text="#{kitchen.audio.off}">Chime Off</span>
                </button>
                <details th:if="${param.preview == null}" class="topbar-account" sec:authorize="isAuthenticated()">
                    <summary class="topbar-account-toggle" id="userDropdown"><svg class="icon" aria-hidden="true"><use href="#i-user-circle"></use></svg> <span sec:authentication="name">User</span></summary>
                    <div class="topbar-account-menu">
                        <p class="topbar-account-who"><span class="topbar-account-avatar"><svg class="icon" aria-hidden="true"><use href="#i-user"></use></svg></span><span><strong sec:authentication="name">Username</strong><small sec:authorize="hasRole('OWNER')" th:text="#{label.role.owner}">Restaurant owner</small></span></p>
                        <a sec:authorize="hasRole('OWNER')" class="topbar-account-item" th:href="@{/owner/console(location=${tenantId})}"><svg class="icon" aria-hidden="true"><use href="#i-store"></use></svg> <span th:text="#{label.ownerWorkspace}">Owner workspace</span></a>
                        <form th:action="${tenantId != null ? '/' + tenantId + '/logout' : '/logout'}" method="post"><button type="submit" class="topbar-account-item is-danger"><svg class="icon" aria-hidden="true"><use href="#i-logout"></use></svg> <span th:text="#{button.logout}">Logout</span></button></form>
                    </div>
                </details>
                <a sec:authorize="!isAuthenticated()" class="topbar-login" th:href="${tenantId != null ? '/' + tenantId + '/login' : '/login'}"><svg class="icon" aria-hidden="true"><use href="#i-login"></use></svg> <span th:text="#{button.login}">Login</span></a>
            </div>
        </div>
    </div>
</header>
