<!-- Shared native navigation for staff pages. -->
<header th:fragment="staff(activeTab)" class="topbar topbar-menu topbar-staff" xmlns:sec="http://www.w3.org/1999/xhtml">
    <div class="topbar-inner">
        <a class="topbar-brand" th:href="${tenantId != null ? '/' + tenantId + '/menu' : '/menu'}">
            <span class="topbar-logo"><svg class="icon" aria-hidden="true"><use href="#i-logo"></use></svg></span>
            <span class="topbar-name" th:text="${restaurantName} ?: #{logo.title}">FastBite</span>
        </a>
        <button type="button" class="topbar-toggle" aria-expanded="false" aria-controls="navbarContent" data-topbar-toggle th:aria-label="#{guest.nav.toggle}">
            <svg class="icon" aria-hidden="true"><use href="#i-bars"></use></svg>
        </button>
        <div class="topbar-content" id="navbarContent">
            <ul th:if="${param.preview == null}" class="topbar-links" sec:authorize="isAuthenticated()">
                <li><a class="topbar-link" th:classappend="${activeTab == 'menu' ? 'is-active' : ''}" th:attr="aria-current=${activeTab == 'menu' ? 'page' : null}" th:href="${tenantId != null ? '/' + tenantId + '/menu' : '/menu'}"><svg class="icon" aria-hidden="true"><use href="#i-utensils"></use></svg> <span th:text="#{staff.nav.menu}">Menu</span></a></li>
                <li sec:authorize="hasAnyRole('ADMIN', 'MANAGER', 'CASHIER', 'COOK', 'WAITER')"><a class="topbar-link" th:classappend="${activeTab == 'dashboard' ? 'is-active' : ''}" th:attr="aria-current=${activeTab == 'dashboard' ? 'page' : null}" th:href="${tenantId != null ? '/' + tenantId + '/dashboard' : '/dashboard'}"><svg class="icon" aria-hidden="true"><use href="#i-gauge"></use></svg> <span th:text="#{staff.nav.kitchen}">Kitchen</span></a></li>
                <li sec:authorize="hasAnyRole('ADMIN', 'MANAGER', 'CASHIER', 'COOK', 'WAITER')"><a class="topbar-link" th:classappend="${activeTab == 'counter' ? 'is-active' : ''}" th:attr="aria-current=${activeTab == 'counter' ? 'page' : null}" th:href="${tenantId != null ? '/' + tenantId + '/counter' : '/counter'}"><svg class="icon" aria-hidden="true"><use href="#i-register"></use></svg> <span th:text="#{staff.nav.counter}">Counter</span></a></li>
                <li sec:authorize="hasAnyRole('ADMIN', 'MANAGER', 'CASHIER', 'WAITER')"><a class="topbar-link" th:classappend="${activeTab == 'tickets' ? 'is-active' : ''}" th:attr="aria-current=${activeTab == 'tickets' ? 'page' : null}" th:href="${tenantId != null ? '/' + tenantId + '/counter/tickets' : '/counter/tickets'}"><svg class="icon" aria-hidden="true"><use href="#i-receipt"></use></svg> <span th:text="#{staff.nav.tickets}">Tickets</span></a></li>
                <li sec:authorize="hasAnyRole('ADMIN', 'MANAGER')"><a class="topbar-link" th:classappend="${activeTab == 'backoffice' ? 'is-active' : ''}" th:attr="aria-current=${activeTab == 'backoffice' ? 'page' : null}" th:href="${tenantId != null ? '/' + tenantId + '/backoffice' : '/backoffice'}"><svg class="icon" aria-hidden="true"><use href="#i-shield-user"></use></svg> <span th:text="#{staff.nav.backoffice}">Management</span></a></li>
            </ul>
            <div class="topbar-actions">
                <button th:if="${activeTab == 'dashboard' || activeTab == 'counter'}" class="topbar-cart" id="kitchenAudioToggleBtn" type="button" th:title="#{kitchen.audio.toggle}" th:data-tap-to-enable="#{kitchen.audio.tapToEnable}" th:data-text-on="#{kitchen.audio.on}" th:data-text-off="#{kitchen.audio.off}" onclick="toggleKitchenAudio()">
                    <svg class="icon" id="kitchenAudioIcon" aria-hidden="true"><use href="#i-bell-off"></use></svg> <span id="kitchenAudioText" th:text="#{kitchen.audio.off}">Chime Off</span>
                </button>
                <details th:if="${param.preview == null}" class="topbar-account" sec:authorize="isAuthenticated()">
                    <summary class="topbar-account-toggle" id="userDropdown"><svg class="icon" aria-hidden="true"><use href="#i-user-circle"></use></svg> <span sec:authentication="name">User</span></summary>
                    <div class="topbar-account-menu">
                        <p class="topbar-account-who"><span class="topbar-account-avatar"><svg class="icon" aria-hidden="true"><use href="#i-user"></use></svg></span><span><strong sec:authentication="name">Username</strong><small sec:authorize="hasRole('OWNER')" th:text="#{label.role.owner}">Restaurant owner</small></span></p>
                        <a sec:authorize="hasRole('OWNER')" class="topbar-account-item" th:href="@{/owner/console(location=${tenantId})}"><svg class="icon" aria-hidden="true"><use href="#i-store"></use></svg> <span th:text="#{label.ownerWorkspace}">Owner workspace</span></a>
                        <form th:action="${tenantId != null ? '/' + tenantId + '/logout' : '/logout'}" method="post"><button type="submit" class="topbar-account-item is-danger"><svg class="icon" aria-hidden="true"><use href="#i-logout"></use></svg> <span th:text="#{button.logout}">Logout</span></button></form>
                    </div>
                </details>
                <a sec:authorize="!isAuthenticated()" class="topbar-login" th:href="${tenantId != null ? '/' + tenantId + '/login' : '/login'}"><svg class="icon" aria-hidden="true"><use href="#i-login"></use></svg> <span th:text="#{button.login}">Login</span></a>
            </div>
        </div>
    </div>
</header>
