<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fastfood/fragments/account :: layout(#{staff.account.title}, ${staff.fullName}, #{account.layout.staffLead}, ~{::section}, null, false)}"><body><section>
<div th:if="${param.updated}" class="account-alert account-success" role="status" th:text="#{staff.account.saved}"></div><p th:if="${staff.email != null}"><span th:text="#{account.email.current}"></span>: <span th:text="${staff.email}"></span></p><p th:if="${staff.pendingEmail != null}" th:text="${staff.pendingEmail}"></p><form th:action="${base + '/email'}" method="post"><div class="field"><label for="email" th:text="#{account.email.label}"></label><input id="email" name="email" type="email" maxlength="254" required></div><button class="button" th:text="#{staff.account.setEmail}"></button></form><form th:action="${base + '/password'}" method="post"><div class="field"><label for="password" th:text="#{account.password.new}"></label><input id="password" name="password" type="password" required autocomplete="new-password"></div><p class="account-help" th:text="#{password.policy}"></p><button class="button" th:text="#{staff.account.setPassword}"></button></form><form th:if="${staff.verified}" th:action="${base + '/reset'}" method="post"><button class="account-link" th:text="#{staff.account.sendReset}"></button></form>
</section></body></html>
