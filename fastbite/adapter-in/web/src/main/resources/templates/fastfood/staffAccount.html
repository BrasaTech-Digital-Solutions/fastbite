<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="#{staff.account.title}">Staff account</title><link rel="stylesheet" href="/css/platform.css"></head><body><main class="panel"><h1 th:text="${staff.fullName}">Staff</h1><p th:if="${param.updated}" th:text="#{staff.account.saved}"></p><p th:if="${staff.email != null}"><span th:text="#{account.email.current}"></span>: <span th:text="${staff.email}"></span></p><p th:if="${staff.pendingEmail != null}" th:text="${staff.pendingEmail}"></p><form th:action="${base + '/email'}" method="post"><label for="email" th:text="#{account.email.label}">Email</label><input id="email" name="email" type="email" maxlength="254" required><button th:text="#{staff.account.setEmail}">Set email</button></form><form th:action="${base + '/password'}" method="post"><label for="password" th:text="#{account.password.new}">New password</label><input id="password" name="password" type="password" required autocomplete="new-password"><p th:text="#{password.policy}"></p><button th:text="#{staff.account.setPassword}">Set password</button></form><form th:if="${staff.verified}" th:action="${base + '/reset'}" method="post"><button th:text="#{staff.account.sendReset}">Send reset link</button></form></main></body></html>
