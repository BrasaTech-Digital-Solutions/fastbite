<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg"><link rel="stylesheet" href="/css/platform.css">
<title th:text="#{signup.check.title}">Check your email</title>
</head>
<body>
<div th:replace="~{fastfood/fragments/environment :: banner}"></div>
<header class="site-header"><a class="brand" href="/"><span class="brand-mark">f.</span>fastbite</a></header>
<main class="wrap"><section class="form-card" style="max-width:620px;margin:4rem auto">
<div th:if="${expired == true}"><h1 th:text="#{signup.expired.title}">This signup is no longer pending.</h1><p th:text="#{signup.expired.body}">Please start again.</p><a class="button" href="/signup" th:text="#{signup.expired.action}">Start again</a></div>
<div th:unless="${expired == true}">
<p th:if="${platform.sandbox and platform.productionUrl == null}" th:text="#{signup.check.sandbox}">The practice environment doesn't send emails.</p>
<h1 th:text="#{signup.check.title}">Check your email</h1>
<p th:text="#{signup.check.body}">We sent a verification link to:</p><p><strong th:text="${email}">email</strong></p>
<p th:text="#{signup.check.help}">Open the link to create your restaurant. It expires in 48 hours.</p>
<div th:if="${error}" class="alert error" role="alert" th:text="${error}"></div>
<div th:if="${param.sent != null}" class="alert success" role="status" th:text="#{signup.check.sent}">If a link can be sent, it is on its way.</div>
<form th:action="@{/signup/check-email/resend}" method="post"><button class="button" type="submit" th:text="#{signup.check.resend}">Resend the email</button></form>
<form th:action="@{/signup/check-email/change}" method="post"><div class="field"><label for="email" th:text="#{signup.check.change}">Wrong address? Change it</label><input id="email" name="email" type="email" th:value="${email}" maxlength="254" required></div><button class="text-link" type="submit" th:text="#{signup.check.change.action}">Update address</button></form>
</div></section></main>
</body></html>
