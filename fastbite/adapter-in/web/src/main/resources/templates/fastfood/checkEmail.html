<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fastfood/fragments/account :: layout(#{signup.check.title}, #{signup.check.title}, #{account.layout.emailLead}, ~{::section}, null, false)}"><body><section>
<div th:if="${expired == true}" class="account-empty"><span class="account-icon" aria-hidden="true">!</span><h2 th:text="#{signup.expired.title}"></h2><p th:text="#{signup.expired.body}"></p><a class="button" href="/signup" th:text="#{signup.expired.action}"></a></div><div th:unless="${expired == true}"><p th:if="${platform.sandbox and platform.productionUrl == null}" th:text="#{signup.check.sandbox}"></p><p th:text="#{signup.check.body}"></p><p><strong th:text="${email}"></strong></p><p th:text="#{signup.check.help}"></p><div th:if="${error}" class="account-alert account-error" role="alert" th:text="${error}"></div><div th:if="${param.sent != null}" class="account-alert account-success" role="status" th:text="#{signup.check.sent}"></div><form th:action="@{/signup/check-email/resend}" method="post"><button class="button" type="submit" th:text="#{signup.check.resend}"></button></form><form th:action="@{/signup/check-email/change}" method="post"><div class="field"><label for="email" th:text="#{signup.check.change}"></label><input id="email" name="email" type="email" th:value="${email}" maxlength="254" th:classappend="${error} ? 'account-invalid'" required></div><button class="account-link" type="submit" th:text="#{signup.check.change.action}"></button></form></div>
</section></body></html>
