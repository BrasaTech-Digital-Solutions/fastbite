<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fastfood/fragments/account :: layout(#{account.email.title}, #{account.email.title}, #{account.email.explain}, ~{::section}, null, false)}"><body><section>
<div th:if="${param.sent}" class="account-alert account-success" role="status" th:text="#{account.email.sent}"></div><div th:if="${param.error}" class="account-alert account-error" role="alert" th:text="#{signup.error.email}"></div><p th:if="${currentEmail}"><span th:text="#{account.email.current}"></span>: <span th:text="${currentEmail}"></span></p><p th:if="${pendingEmail}" th:text="${pendingEmail}"></p><form method="post" th:action="@{/owner/account/verify}"><div class="field"><label for="email" th:text="#{account.email.label}"></label><input id="email" name="email" type="email" maxlength="254" th:classappend="${param.error} ? 'account-invalid'" required autocomplete="email"></div><button class="button" th:text="#{account.email.send}"></button></form><form th:if="${pendingEmail}" method="post" th:action="@{/owner/account/verify/resend}"><button class="account-link" th:text="#{account.email.resend}"></button></form><form method="post" th:action="@{/logout}"><button class="account-link" th:text="#{account.email.logout}"></button></form>
</section></body></html>
