<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="#{account.email.title}">Verify email</title><link rel="stylesheet" href="/css/platform.css"></head><body><main class="panel"><h1 th:text="#{account.email.title}">Verify email</h1><p th:text="#{account.email.explain}"></p><p th:if="${param.sent}" th:text="#{account.email.sent}"></p><p th:if="${param.error}" role="alert" th:text="#{signup.error.email}"></p><p th:if="${currentEmail}"><span th:text="#{account.email.current}">Current email</span>: <span th:text="${currentEmail}"></span></p><p th:if="${pendingEmail}" th:text="${pendingEmail}"></p><form method="post" th:action="@{/owner/account/verify}"><label for="email" th:text="#{account.email.label}">Email</label><input id="email" name="email" type="email" maxlength="254" required autocomplete="email"><button th:text="#{account.email.send}">Send verification</button></form><form th:if="${pendingEmail}" method="post" th:action="@{/owner/account/verify/resend}"><button th:text="#{account.email.resend}">Resend</button></form><form method="post" th:action="@{/logout}"><button th:text="#{account.email.logout}">Sign out</button></form></main></body></html>
