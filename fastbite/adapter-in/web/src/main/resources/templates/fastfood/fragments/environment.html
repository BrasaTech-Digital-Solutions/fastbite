<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="banner">
<!-- On every page of the sandbox: it must never be mistaken for production -->
<div th:if="${platform != null && platform.sandbox()}" class="fb-sandbox-banner" role="note">
    <style>
        .fb-sandbox-banner{position:sticky;top:0;z-index:2000;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.25rem .75rem;
            padding:.45rem 1rem;font:600 13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;color:#1c1a14;text-align:center;
            background:repeating-linear-gradient(135deg,#ffd23f 0 18px,#ffc61a 18px 36px);border-bottom:2px solid #1c1a14}
        .fb-sandbox-banner strong{letter-spacing:.08em;padding:.1rem .45rem;border:2px solid #1c1a14;border-radius:4px;background:#fff8dc}
        .fb-sandbox-banner a{color:#1c1a14;text-decoration:underline;font-weight:700}
        @media print{.fb-sandbox-banner{display:none}}
    </style>
    <strong th:text="#{sandbox.banner.label}">SANDBOX</strong>
    <span th:text="#{sandbox.banner.text}">Practice environment: nothing here is real.</span>
    <a th:if="${platform.productionUrl() != null}" th:href="${platform.productionUrl()}" th:text="#{sandbox.banner.back}">Go to FastBite</a>
    <script>
        (() => {
            const prefix = '[Sandbox] ';
            if (!document.title.startsWith(prefix)) document.title = prefix + document.title;
            document.querySelectorAll('link[rel~="icon"]').forEach(icon => { icon.href = '/images/favicon-sandbox.svg'; });
        })();
    </script>
</div>
<!--/* Production VERI*FACTU hold banner: shown when the location cannot issue tickets yet */-->
<div th:if="${platform != null && !platform.sandbox() && verifactuBanner != null}"
     th:class="${'fb-verifactu-banner fb-verifactu-banner--' + verifactuBanner.audience()}"
     role="status">
    <style>
        .fb-verifactu-banner{position:sticky;top:0;z-index:1900;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.3rem .75rem;
            padding:.55rem 1rem;font:600 13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;
            color:var(--fb-hold-ink,#451a03);background:var(--fb-hold-bg,#fef3c7);border-bottom:2px solid var(--fb-hold-border,#d97706)}
        .fb-verifactu-banner--guest{color:var(--fb-guest-hold-ink,#1f2937);background:var(--fb-guest-hold-bg,#f3f4f6);border-bottom-color:var(--fb-guest-hold-border,#9ca3af)}
        .fb-verifactu-banner__reason{font-weight:500}
        .fb-verifactu-banner__link{color:inherit;text-decoration:underline;font-weight:700}
        @media print{.fb-verifactu-banner{display:none}}
    </style>
    <span class="fb-verifactu-banner__text" th:text="${#messages.msg(verifactuBanner.messageKey())}">This location cannot issue tickets yet.</span>
    <span class="fb-verifactu-banner__reason" th:if="${verifactuBanner.reasonKey() != null}"
          th:text="${'— ' + #messages.msg(verifactuBanner.reasonKey())}">Reason</span>
    <span class="fb-verifactu-banner__reason" th:if="${verifactuBanner.reasonKey() == 'verifactu.hold.reason.collaboration_inactive'}"
          th:text="#{verifactu.banner.owner.collaboration_wait}">There is nothing you need to do. We will let you know when ticket issuing starts.</span>
    <a class="fb-verifactu-banner__link" th:if="${verifactuBanner.reasonKey() == 'verifactu.hold.reason.fiscal_incomplete'}"
       th:href="@{/owner/console(view='location-settings',section='legal',location=${verifactuBanner.tenantId()})}"
       th:text="#{verifactu.banner.owner.complete_business}">Complete business details</a>
    <a class="fb-verifactu-banner__link" th:if="${verifactuBanner.actionUrl() != null && verifactuBanner.reasonKey() != 'verifactu.hold.reason.fiscal_incomplete' && verifactuBanner.reasonKey() != 'verifactu.hold.reason.collaboration_inactive'}"
       th:href="${verifactuBanner.actionUrl()}" th:text="${#messages.msg(verifactuBanner.actionLabelKey())}">Go to VERI*FACTU step</a>
</div>
</th:block>
</body>
</html>
