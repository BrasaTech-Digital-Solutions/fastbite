<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <title th:text="#{ticket.proforma.title}">Bill</title>
    <link rel="stylesheet" th:href="@{/css/ticket.css}">
</head>
<body class="paper">
<div th:replace="~{fastfood/fragments/environment :: banner}"></div>

<header class="center">
    <p class="trade" th:text="${profile.displayName() ?: #messages.msg('ticket.missing')}">Kebab House</p>
    <p th:if="${profile.addressLine() != null}" th:text="${profile.addressLine()}">Calle Mayor 12</p>
    <p th:if="${profile.postalCode() != null}" th:text="${profile.postalCode() + ' ' + (profile.city() ?: '')}">28013 Madrid</p>
</header>

<hr class="rule">

<div class="center">
    <span class="kind" th:text="#{ticket.proforma.title}">Bill — not an invoice</span>
    <p th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy HH:mm')}">09/10/2026 13:45</p>
    <p th:text="#{ticket.orders} + ': #' + ${#strings.listJoin(orders.![orderNumber], ', #')}">Orders: #12</p>
</div>

<hr class="rule">

<table>
    <thead>
    <tr>
        <th th:text="#{label.qty}">Qty</th>
        <th th:text="#{label.item}">Item</th>
        <th class="num" th:text="#{label.total}">Total</th>
    </tr>
    </thead>
    <tbody>
    <th:block th:each="order : ${orders}">
        <th:block th:each="item : ${order.items}">
            <tr>
                <td th:text="${item.quantity}">1</td>
                <td th:text="${item.name}">Kebab</td>
                <td class="num" th:text="${#numbers.formatDecimal(item.totalPrice, 1, 'POINT', 2, 'COMMA')}">7,50</td>
            </tr>
            <tr th:each="option : ${item.customizations}">
                <td></td>
                <td class="option" colspan="2" th:text="${option.quantity == 0 ? option.name : '+ ' + option.name}">+ Garlic sauce</td>
            </tr>
        </th:block>
    </th:block>
    </tbody>
</table>

<hr class="rule">

<div class="row" th:if="${discount > 0}">
    <span th:text="#{label.discount}">Discount</span>
    <span th:text="'-' + ${#numbers.formatDecimal(discount, 1, 'POINT', 2, 'COMMA')}">-1,00</span>
</div>
<div class="row big">
    <span th:text="#{label.total}">TOTAL</span>
    <span th:text="${#numbers.formatDecimal(grandTotal, 1, 'POINT', 2, 'COMMA')} + ' €'">11,00 €</span>
</div>
<div class="row muted" th:each="vatLine : ${vat.lines()}">
    <span th:text="#{label.vat.included.rate(${vatLine.rate().intValue()})}">VAT included (10%)</span>
    <span th:text="${#numbers.formatDecimal(vatLine.vat(), 1, 'POINT', 2, 'COMMA')}">1,00</span>
</div>

<hr class="rule">

<footer class="footer">
    <p th:text="#{ticket.proforma.note}">Your invoice is printed when you pay.</p>
    <p th:text="#{ticket.thanks}">Thank you for your visit!</p>
</footer>

<div class="print-bar"><button type="button" onclick="window.print()" th:text="#{ticket.print}">Print</button></div>
</body>
</html>
