<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="content" th:unless="${linkedProduction && setup.needsStart() && !setup.progress.dismissed && !(showOpening == true)}">
<div class="opening-layout">
<section class="panel" th:if="${ordersNeedingRefund != null && !#lists.isEmpty(ordersNeedingRefund)}" role="alert">
<h2 th:text="#{workspace.refunds.needed.title}">Online orders needing refund</h2>
<p th:text="#{workspace.refunds.needed.desc}">These online payments arrived while this location could not issue tickets and could not be refunded automatically. Refund them in your Stripe dashboard.</p>
<div class="billing-row" th:each="ord : ${ordersNeedingRefund}">
<div>
<strong th:text="${'#' + ord.orderNumber()}">#1</strong>
<span class="fine" th:if="${ord.customerName() != null && !#strings.isEmpty(ord.customerName())}" th:text="${ord.customerName()}">Guest</span>
<span class="fine" th:if="${ord.total() != null}" th:text="${#prices.format(ord.total())}">0,00 €</span>
<span class="fine" th:if="${ord.createdAt() != null}" th:text="${#temporals.format(ord.createdAt(), 'dd/MM/yyyy HH:mm')}">Date</span>
<span class="fine" th:if="${ord.cancelReason() != null}" th:text="${ord.cancelReason()}">Reason</span>
</div>
</div>
</section>
<section class="panel daily-tools" th:if="${setup.opened()}"><h2 th:text="#{opening.tools}"></h2>
<div class="today-tools-grid"><a class="tool-link" th:href="@{/{tenant}/counter(tenant=${selected.tenantId})}"><img class="tool-preview" th:src="${selectedTheme.counterPreview()}" alt="" width="380" height="190"><span th:text="#{opening.counter}"></span></a><a class="tool-link" th:href="@{/{tenant}/dashboard(tenant=${selected.tenantId})}"><img class="tool-preview" th:src="${selectedTheme.kitchenPreview()}" alt="" width="380" height="190"><span th:text="#{opening.kitchen}"></span></a><a class="tool-link" data-guest-preview th:data-url="@{/{tenant}/menu(tenant=${selected.tenantId})}" th:href="@{/{tenant}/menu(tenant=${selected.tenantId})}"><img class="tool-preview" th:src="${selectedTheme.menuPreview()}" alt="" width="380" height="190"><span th:text="#{opening.guest}"></span></a></div>
<div class="today-detail-grid"><div class="opening-attention" th:if="${!setup.ready() || trialEndsSoon || freePlanPaymentsMissing || (todayVerifactu != null && (todayVerifactu.pending() > 0 || !#lists.isEmpty(todayVerifactu.toAmend())))}"><h3 th:text="#{opening.attention}"></h3><ul><li th:if="${todayVerifactu != null && !#lists.isEmpty(todayVerifactu.toAmend())}"><a th:href="@{/owner/console(view='tickets',location=${selected.tenantId})}" th:text="#{workspace.today.records.rejected}"></a></li><li th:if="${todayVerifactu != null && todayVerifactu.pending() > 0}"><a th:href="@{/owner/console(view='tickets',location=${selected.tenantId})}" th:text="#{workspace.today.records.pending}"></a></li><li th:if="${trialEndsSoon}"><a th:href="@{/owner/billing/{tenant}(tenant=${selected.tenantId})}" th:text="#{workspace.today.trial}"></a></li><li th:if="${freePlanPaymentsMissing}"><a th:href="@{/owner/console(view='location-config',section='payments',location=${selected.tenantId})}" th:text="#{workspace.today.free.paused}"></a></li><li th:unless="${setup.menuDone()}"><a th:href="@{/{tenant}/backoffice(tenant=${selected.tenantId})}" th:text="${linkedProduction ? #messages.msg('opening.menu.title') : #messages.msg('opening.menu.title.standalone')}"></a></li><li th:unless="${setup.fiscalDone()}"><a th:href="@{/owner/console(view='tickets',location=${selected.tenantId})}" th:text="#{opening.fiscal.title}"></a></li><li th:if="${setup.verifactuRequired() && !setup.verifactuDone()}"><a href="#opening-step-verifactu" th:text="#{opening.verifactu.title}"></a></li><li th:unless="${setup.serviceDone()}"><a th:href="@{/owner/console(view='location-config',location=${selected.tenantId})}" th:text="#{opening.service.title}"></a></li><li th:unless="${setup.paymentsDone()}"><a th:href="@{/owner/console(view='location-config',section='payments',location=${selected.tenantId})}" th:text="#{opening.payments.title}"></a></li><li th:unless="${setup.teamDone()}"><a th:href="@{/owner/console(view='team',location=${selected.tenantId})}" th:text="#{opening.team.title}"></a></li><li th:unless="${setup.previewDone()}"><button class="quiet-button" data-guest-preview th:data-url="@{/{tenant}/menu(tenant=${selected.tenantId})}" th:text="#{opening.preview.title}"></button></li></ul><dl class="verifactu-stats" th:if="${todayVerifactu != null}"><div><dt th:text="#{owner.verifactu.records}"></dt><dd th:text="${todayVerifactu.total()}"></dd></div><div><dt th:text="#{owner.verifactu.pending}"></dt><dd th:text="${todayVerifactu.pending()}"></dd></div><div><dt th:text="#{owner.verifactu.accepted}"></dt><dd th:text="${todayVerifactu.accepted()}"></dd></div><div th:classappend="${todayVerifactu.refused() > 0} ? 'alert-stat'"><dt th:text="#{owner.verifactu.rejected}"></dt><dd th:text="${todayVerifactu.refused()}"></dd></div></dl></div>
<nav class="today-shortcuts" th:attr="aria-label=#{workspace.today.shortcuts}"><h3 th:text="#{workspace.today.shortcuts}"></h3><a th:href="@{/owner/console(view='menu',location=${selected.tenantId})}" th:text="#{workspace.nav.menu}"></a><a th:href="@{/owner/console(view='team',location=${selected.tenantId})}" th:text="#{workspace.nav.team}"></a><a th:href="@{/owner/console(view='tickets',location=${selected.tenantId})}" th:text="#{workspace.nav.tickets}"></a><a th:href="@{/owner/console(view='data',location=${selected.tenantId})}" th:text="#{workspace.nav.data}"></a><a th:unless="${linkedSandbox}" th:href="@{/owner/billing/{tenant}(tenant=${selected.tenantId})}" th:text="#{workspace.nav.billing}"></a></nav></div>
<form th:if="${setup.progress.dismissed}" th:action="@{/owner/workspace/{tenant}/setup(tenant=${selected.tenantId})}" method="post"><input type="hidden" name="action" value="resume"><button class="quiet-button" th:text="#{opening.show}"></button></form>
</section>
<section class="panel setup-panel" th:if="${!setup.opened() || !setup.progress.dismissed}">
<div class="panel-heading"><h2 th:text="#{opening.checklist}">Opening checklist</h2><span class="status-pill" th:text="#{opening.count(${setup.completed()},${setup.steps()})}"></span></div>
<progress th:max="${setup.steps()}" th:value="${setup.completed()}" th:attr="aria-label=#{opening.checklist}"></progress>
<div class="opening-next" th:unless="${setup.ready()}" th:switch="${setup.nextStep()}"><strong th:text="#{opening.next}">Next step</strong>
<a th:case="'menu'" id="opening-next-action" th:href="${linkedProduction} ? @{/owner/console(view='data',section='backup',location=${selected.tenantId})} : @{/{tenant}/backoffice(tenant=${selected.tenantId})}" th:text="${linkedProduction ? #messages.msg('opening.menu.title') : #messages.msg('opening.menu.title.standalone')}"></a>
<a th:case="'fiscal'" id="opening-next-action" th:href="@{/owner/console(view='tickets',location=${selected.tenantId})}" th:text="#{opening.fiscal.title}"></a>
<a th:case="'verifactu'" id="opening-next-action" href="#opening-step-verifactu" th:text="#{opening.verifactu.title}"></a>
<a th:case="'service'" id="opening-next-action" th:href="@{/owner/console(view='location-config',section='general',location=${selected.tenantId})}" th:text="#{opening.service.title}"></a>
<a th:case="'payments'" id="opening-next-action" th:href="@{/owner/console(view='location-config',section='payments',location=${selected.tenantId})}" th:text="#{opening.payments.title}"></a>
<a th:case="'team'" id="opening-next-action" th:href="@{/owner/console(view='team',location=${selected.tenantId})}" th:text="#{opening.team.title}"></a>
<button th:case="'preview'" id="opening-next-action" class="quiet-button" data-guest-preview th:data-url="@{/{tenant}/menu(tenant=${selected.tenantId})}" th:text="#{opening.preview.title}"></button></div>
<ol class="setup-list">
<li><span class="step-number" th:classappend="${setup.menuDone()} ? 'done'" th:text="${setup.menuDone()} ? '✓' : '1'"></span><div><h3><span th:text="${linkedProduction ? #messages.msg('opening.menu.title') : #messages.msg('opening.menu.title.standalone')}">Menu</span> <span class="opening-tag" th:text="#{opening.required}">Required</span></h3><p th:text="${linkedProduction ? #messages.msg('opening.menu.desc') : #messages.msg('opening.menu.desc.standalone')}"></p><div th:if="${linkedProduction}" class="opening-transfer"><div><strong th:text="#{opening.transfer.comes}"></strong><ul><li th:text="#{opening.transfer.menu}"></li><li th:text="#{opening.transfer.tables}"></li><li th:text="#{opening.transfer.appearance}"></li></ul></div><div><strong th:text="#{opening.transfer.stays}"></strong><ul><li th:text="#{opening.transfer.orders}"></li><li th:text="#{opening.transfer.staff}"></li><li th:text="#{opening.transfer.payments}"></li></ul></div></div><a th:if="${linkedProduction}" class="text-link" th:href="@{/owner/console(view='data',section='backup',location=${selected.tenantId})}" th:text="#{opening.menu.promotion}"></a> <a class="text-link" th:href="@{/owner/console(view='data',section='backup',location=${selected.tenantId})}" th:text="#{opening.menu.restore}"></a> <a class="text-link" th:href="@{/{tenant}/backoffice(tenant=${selected.tenantId})}" th:text="#{opening.menu.empty}"></a><span th:unless="${linkedProduction}"><a class="text-link" th:href="@{/owner/console(view='data',section='advanced',location=${selected.tenantId})}" th:text="#{opening.menu.demo}"></a></span></div></li>
<li><span class="step-number" th:classappend="${setup.fiscalDone()} ? 'done'" th:text="${setup.fiscalDone()} ? '✓' : '2'"></span><div><h3><span th:text="#{opening.fiscal.title}"></span> <span class="opening-tag" th:text="#{opening.required}"></span></h3><p th:text="#{opening.fiscal.details}"></p><p th:text="#{opening.fiscal.desc}"></p><a class="text-link" th:href="@{/owner/console(view='tickets',location=${selected.tenantId})}" th:text="#{opening.fiscal.action}"></a></div></li>
<li id="opening-step-verifactu" th:if="${setup.verifactuRequired()}"><span class="step-number" th:classappend="${setup.verifactuDone()} ? 'done'" th:text="${setup.verifactuDone()} ? '✓' : '3'"></span><div><h3><span th:text="#{opening.verifactu.title}">VERI*FACTU</span> <span class="opening-tag" th:text="#{opening.required}"></span></h3><p th:text="#{opening.verifactu.desc}"></p><th:block th:if="${verifactuStep != null && verifactuStep.fiscalComplete()}"><p class="fine" th:text="#{opening.verifactu.fiscal.summary(${verifactuStep.legalName()}, ${verifactuStep.nif()})}"></p><p><strong th:text="${#messages.msg(verifactuStep.statusMessageKey())}"></strong><span th:if="${verifactuStep.reasonMessageKey() != null}" th:text="${' — ' + #messages.msg(verifactuStep.reasonMessageKey())}"></span></p><div class="billing-actions"><form th:if="${verifactuStep.canSign()}" th:action="@{/owner/workspace/{tenant}/verifactu/authorize(tenant=${selected.tenantId})}" method="post" target="_blank"><button type="submit" class="button" th:text="#{opening.verifactu.action.sign}">Firmar con certificado digital</button></form><form th:if="${verifactuStep.canRetry()}" th:action="@{/owner/workspace/{tenant}/verifactu/authorize(tenant=${selected.tenantId})}" method="post" target="_blank"><button type="submit" class="button" th:text="#{opening.verifactu.action.retry}">Firmar de nuevo</button></form><form th:if="${verifactuStep.canRefresh()}" th:action="@{/owner/workspace/{tenant}/verifactu/refresh(tenant=${selected.tenantId})}" method="post"><button type="submit" class="quiet-button" th:text="#{opening.verifactu.action.refresh}">Comprobar ahora</button></form><button th:if="${verifactuStep.canRevoke()}" type="button" class="danger-button" data-verifactu-revoke th:text="#{opening.verifactu.action.revoke}">Revocar autorización</button></div></th:block><th:block th:unless="${verifactuStep != null && verifactuStep.fiscalComplete()}"><p class="fine" th:text="#{opening.verifactu.status.fiscal_required}"></p><a class="text-link" th:href="@{/owner/console(view='tickets',location=${selected.tenantId})}" th:text="#{opening.fiscal.action}"></a></th:block></div></li>
<li><span class="step-number" th:classappend="${setup.serviceDone()} ? 'done'" th:text="${setup.serviceDone()} ? '✓' : (${setup.verifactuRequired()} ? '4' : '3')"></span><div><h3><span th:text="#{opening.service.title}"></span> <span class="opening-tag" th:text="#{opening.required}"></span></h3><p th:text="#{opening.service.desc}"></p><a class="text-link" th:href="@{/owner/console(view='location-config',section='general',location=${selected.tenantId})}" th:text="#{opening.service.action}"></a></div></li>
<li th:if="${setup.paymentsRequired()}"><span class="step-number" th:classappend="${setup.paymentsDone()} ? 'done'" th:text="${setup.paymentsDone()} ? '✓' : (${setup.verifactuRequired()} ? '5' : '4')"></span><div><h3><span th:text="#{opening.payments.title}"></span> <span class="opening-tag opening-tag-conditional" th:text="#{opening.payments.tag}"></span></h3><p th:text="#{opening.payments.desc}"></p><a class="text-link" th:href="@{/owner/console(view='location-config',section='payments',location=${selected.tenantId})}" th:text="#{opening.payments.action}"></a></div></li>
<li><span class="step-number" th:classappend="${setup.teamDone()} ? 'done'" th:text="${setup.teamDone()} ? '✓' : (${setup.verifactuRequired()} ? (${setup.paymentsRequired()} ? '6' : '5') : (${setup.paymentsRequired()} ? '5' : '4'))"></span><div><h3><span th:text="#{opening.team.title}"></span> <span class="opening-tag" th:text="#{opening.required}"></span></h3><p th:text="#{opening.team.desc}"></p><a class="text-link" th:href="@{/owner/console(view='team',location=${selected.tenantId})}" th:text="#{opening.team.action}"></a><form th:unless="${setup.hasStaff()}" th:action="@{/owner/workspace/{tenant}/setup(tenant=${selected.tenantId})}" method="post"><input type="hidden" name="action" th:value="${setup.progress.workAlone} ? 'work_with_team' : 'work_alone'"><button type="submit" class="quiet-button" th:text="${setup.progress.workAlone} ? #{opening.team.undo} : #{opening.team.alone}"></button></form></div></li>
<li><span class="step-number" th:classappend="${setup.previewDone()} ? 'done'" th:text="${setup.previewDone()} ? '✓' : (${setup.verifactuRequired()} ? (${setup.paymentsRequired()} ? '7' : '6') : (${setup.paymentsRequired()} ? '6' : '5'))"></span><div><h3><span th:text="#{opening.preview.title}"></span> <span class="opening-tag" th:text="#{opening.required}"></span></h3><p th:text="#{opening.preview.desc}"></p><button type="button" class="quiet-button" data-guest-preview th:data-url="@{/{tenant}/menu(tenant=${selected.tenantId})}" th:text="#{opening.preview.action}"></button><form th:unless="${setup.previewDone()}" th:action="@{/owner/workspace/{tenant}/setup(tenant=${selected.tenantId})}" method="post"><input type="hidden" name="action" value="preview"><button class="quiet-button" th:text="#{opening.preview.done}"></button></form></div></li>
</ol>
<div class="panel-foot" th:if="${setup.opened()}"><form th:action="@{/owner/workspace/{tenant}/setup(tenant=${selected.tenantId})}" method="post"><input type="hidden" name="action" value="dismiss"><button class="quiet-button" th:text="#{opening.hide}"></button></form></div>
</section>
</div></section></body></html>
