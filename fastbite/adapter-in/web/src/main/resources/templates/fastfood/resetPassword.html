<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fastfood/fragments/account :: layout(#{recovery.reset}, #{recovery.reset}, #{account.layout.resetLead}, ~{::section}, null, false)}"><body><section>
<div th:if="${invalid}" class="account-empty"><span class="account-icon" aria-hidden="true">!</span><h2 th:text="#{account.layout.invalidTitle}"></h2><p th:text="#{recovery.invalid}"></p><a class="button" href="/forgot-password" th:text="#{account.layout.newLink}"></a></div><div th:if="${invalidPassword}" class="account-alert account-error" role="alert" th:text="#{recovery.passwordError}"></div><form th:unless="${invalid}" th:action="@{/reset-password}" method="post"><input type="hidden" name="token" th:value="${token}"><div class="field"><label for="password" th:text="#{account.password.new}"></label><input id="password" name="password" type="password" th:classappend="${invalidPassword} ? 'account-invalid'" th:attr="aria-invalid=${invalidPassword} ? 'true' : null" required autocomplete="new-password"></div><div class="field"><label for="confirmation" th:text="#{account.password.confirm}"></label><input id="confirmation" name="confirmation" type="password" th:classappend="${invalidPassword} ? 'account-invalid'" required autocomplete="new-password"></div><p class="account-help" th:text="#{password.policy}"></p><button class="button" th:text="#{recovery.reset}"></button></form><a class="account-link" href="/login" th:text="#{recovery.back}"></a>
</section></body></html>
