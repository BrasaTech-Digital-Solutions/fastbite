<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title th:text="#{recovery.reset}">Reset password</title><link rel="stylesheet" href="/css/platform.css"></head><body><main class="panel"><h1 th:text="#{recovery.reset}">Reset password</h1><p th:if="${invalid}" role="alert" th:text="#{recovery.invalid}"></p><p th:if="${invalidPassword}" role="alert" th:text="#{recovery.passwordError}"></p><form th:unless="${invalid}" th:action="@{/reset-password}" method="post"><input type="hidden" name="token" th:value="${token}"><label for="password" th:text="#{account.password.new}">New password</label><input id="password" name="password" type="password" required autocomplete="new-password"><label for="confirmation" th:text="#{account.password.confirm}">Confirm password</label><input id="confirmation" name="confirmation" type="password" required autocomplete="new-password"><p th:text="#{password.policy}"></p><button th:text="#{recovery.reset}">Reset password</button></form><a href="/login" th:text="#{recovery.back}">Back to login</a></main></body></html>
