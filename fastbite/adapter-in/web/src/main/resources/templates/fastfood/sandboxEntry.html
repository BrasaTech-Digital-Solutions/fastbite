<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Enter the sandbox - FastBite</title>
    <link href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fastfood/fragments/environment :: banner}"></div>
<main class="container py-5" style="max-width: 520px">
    <div class="card shadow-sm p-4">
        <h1 class="h3 mb-3">Enter the sandbox</h1>
        <p th:if="${refusal == 'INVALID'}" class="alert alert-warning" role="alert">
            This link has expired or was already used. Open the sandbox again from FastBite.
        </p>
        <p th:if="${refusal == 'OTHER_VERSION'}" class="alert alert-info" role="status">
            The sandbox is being updated to a new version. Try again in a minute.
        </p>
        <p th:if="${refusal == 'NOT_READY'}" class="alert alert-info" role="status">
            Your practice space is still being prepared. Try again in a minute.
        </p>
        <a th:href="${enterUrl}" class="btn btn-primary">Open the sandbox again</a>
    </div>
</main>
</body>
</html>
