<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fastfood/fragments/account :: layout(#{setup.password.title}, #{setup.password.heading}, #{account.layout.resetLead}, ~{::section}, null, true)}"><body><section>
<div th:if="${invalid == true}" class="account-empty"><span class="account-icon" aria-hidden="true">!</span><h2 th:text="#{account.layout.invalidTitle}"></h2><p th:text="#{setup.password.invalid}"></p><a class="button" href="/forgot-password" th:text="#{account.layout.newLink}"></a></div><div th:if="${complete == true}"><p class="account-alert account-success" role="status" th:text="#{setup.password.complete}"></p><a href="/login" class="button" th:text="#{setup.password.signin}"></a></div><form th:if="${token != null}" th:action="@{/set-password}" method="post"><input type="hidden" name="token" th:value="${token}"><div th:if="${error != null}" class="account-alert account-error" role="alert" th:text="${error}"></div><div class="field"><label for="password" th:text="#{account.password.new}"></label><input id="password" name="password" type="password" th:classappend="${error != null} ? 'account-invalid'" minlength="10" maxlength="72" autocomplete="new-password" required></div><div class="field"><label for="confirmation" th:text="#{account.password.confirm}"></label><input id="confirmation" name="confirmation" type="password" th:classappend="${error != null} ? 'account-invalid'" minlength="10" maxlength="72" autocomplete="new-password" required></div><p class="account-help" th:text="#{password.policy}"></p><button type="submit" class="button" th:text="#{setup.password.action}"></button></form>
</section></body></html>
