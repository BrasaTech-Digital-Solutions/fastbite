<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Set your password - FastBite</title>
    <link href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fastfood/fragments/environment :: banner}"></div>
<main class="container py-5" style="max-width: 520px">
    <div class="card shadow-sm p-4">
        <h1 class="h3 mb-3">Set your FastBite password</h1>
        <div th:if="${invalid == true}" class="alert alert-danger" role="alert">
            This link is invalid, expired, or already used. Contact support for a new setup email.
        </div>
        <div th:if="${complete == true}">
            <p class="alert alert-success" role="status">Your password is set. You can now sign in.</p>
            <a href="/login" class="btn btn-primary">Sign in</a>
        </div>
        <form th:if="${token != null}" th:action="@{/set-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">
            <p>Choose a password with at least 12 characters.</p>
            <p th:if="${error != null}" th:text="${error}" class="alert alert-danger" role="alert"></p>
            <label for="password" class="form-label">New password</label>
            <input id="password" name="password" type="password" class="form-control mb-3" minlength="12" maxlength="72" autocomplete="new-password" required>
            <label for="confirmation" class="form-label">Confirm password</label>
            <input id="confirmation" name="confirmation" type="password" class="form-control mb-4" minlength="12" maxlength="72" autocomplete="new-password" required>
            <button type="submit" class="btn btn-primary w-100">Set password</button>
        </form>
    </div>
</main>
</body>
</html>
