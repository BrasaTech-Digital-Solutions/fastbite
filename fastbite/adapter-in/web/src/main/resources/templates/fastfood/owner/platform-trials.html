<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head><link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="#{workspace.trials.title}">Platform trials — FastBite</title>
<link rel="stylesheet" href="/css/platform.css">
<link rel="stylesheet" href="/css/workspace.css">
</head>
<body class="workspace">
<div th:replace="~{fastfood/fragments/environment :: banner}"></div><a class="skip-link" href="#workspace-main" th:text="#{workspace.rebuild.more.51}">Skip to content</a>
<aside th:replace="~{fastfood/owner/workspace-shell :: sidebar}"></aside>
<div class="workspace-content"><header th:replace="~{fastfood/owner/workspace-shell :: topbar}"></header>
<main class="workspace-main" id="workspace-main">
<a class="text-link" href="/owner/console?view=settings" th:text="#{workspace.rebuild.more.52}">← Account &amp; billing</a>
<p class="eyebrow" th:text="#{workspace.rebuild.more.70}">BRASATECH PLATFORM ADMINISTRATION</p>
<h1 th:text="#{workspace.rebuild.more.71}">Restaurant trials</h1>
<p th:text="#{workspace.rebuild.more.72}">Extend a production location’s trial period for a pilot or commercial agreement.</p>
<div th:if="${error}" class="alert error" role="alert" th:text="${error}"></div>
<div th:if="${notice}" class="alert success" role="status" th:text="${notice}"></div>
<section class="panel">
<div class="ws-trial-row billing-row" th:each="acc : ${accounts}">
<div>
<strong th:text="${acc.tenantId}">tenant</strong>
<span class="fine" th:text="${#messages.msg('workspace.trials.owner', acc.owner)}">Owner</span>
<span class="fine" th:text="${#messages.msg('workspace.trials.status', trialLabels[acc.tenantId])}">Status</span>
<span class="fine" th:text="${#messages.msg('workspace.trials.ends', #temporals.format(acc.trialEndsAt(), 'dd/MM/yyyy HH:mm', 'UTC'))}">Trial end</span>
</div>
<form class="ws-trial-form compact-form" th:action="@{/owner/platform/trials/{tenant}/extend(tenant=${acc.tenantId})}" method="post">
<label th:for="${'days-' + acc.tenantId}" class="sr-only" th:text="#{workspace.rebuild.more.73}">Days</label>
<input th:id="${'days-' + acc.tenantId}" name="days" type="number" min="1" max="180" value="14" required class="ws-days">
<button class="button secondary" type="submit" th:text="#{workspace.rebuild.more.74}">+ Add days</button>
</form>
</div>
</section>
</main>
</div>
</body>
</html>
