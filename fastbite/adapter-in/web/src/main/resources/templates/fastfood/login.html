<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fastfood/fragments/account :: layout(#{login.title}, #{account.layout.loginTitle}, #{account.layout.loginLead}, ~{::section}, null, true)}"><body><section>
<form th:action="@{/login(tenantId=${tenantId})}" method="post"><div th:if="${param.error}" class="account-alert account-error" role="alert" th:text="#{login.error}"></div><div th:if="${param.verified}" class="account-alert account-success" role="status" th:text="#{login.verified}"></div><div th:if="${param.reset}" class="account-alert account-success" role="status" th:text="#{recovery.resetComplete}"></div><div th:if="${param.logout}" class="account-alert account-success" role="status" th:text="#{login.logout}"></div><div class="field"><label for="username" th:text="#{recovery.identifier}"></label><input id="username" type="text" name="username" th:classappend="${param.error} ? 'account-invalid'" autocomplete="username" required autofocus></div><div class="field"><label for="password" th:text="#{label.password}"></label><input id="password" type="password" name="password" th:classappend="${param.error} ? 'account-invalid'" autocomplete="current-password" required></div><a class="account-link" th:href="@{/forgot-password(tenantId=${tenantId})}" th:text="#{recovery.forgot}"></a><button type="submit" class="button" th:text="#{button.login}"></button><p th:if="${platform != null && platform.productionUrl() != null}" class="account-help"><span th:text="#{sandbox.login.owner}"></span> <a th:href="${platform.productionUrl() + '/owner/sandbox'}" th:text="#{sandbox.login.enter}"></a></p><a class="account-link" th:href="${tenantId != null ? '/' + tenantId + '/menu' : '/'}" th:text="#{button.back.to.menu}"></a></form>
</section></body></html>
