<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- The customer named on a full invoice. Ids start with the prefix so the fields can appear twice on a page. -->
<div th:fragment="fields(prefix)" class="row g-2 invoice-fields">
    <div class="col-8">
        <label class="form-label small mb-1" th:for="${prefix + '-taxId'}" th:text="#{tickets.customer.taxId}">Customer tax ID</label>
        <input type="text" class="form-control" th:id="${prefix + '-taxId'}" maxlength="20" autocomplete="off"
               autocapitalize="characters" spellcheck="false">
    </div>
    <div class="col-4">
        <label class="form-label small mb-1" th:for="${prefix + '-country'}" th:text="#{tickets.customer.country}">Country</label>
        <select class="form-select" th:id="${prefix + '-country'}">
            <option value="ES" selected>ES · España</option>
            <option value="PT">PT · Portugal</option>
            <option value="FR">FR · France</option>
            <option value="DE">DE · Deutschland</option>
            <option value="IT">IT · Italia</option>
            <option value="NL">NL · Nederland</option>
            <option value="BE">BE · Belgique</option>
            <option value="IE">IE · Ireland</option>
            <option value="AT">AT · Österreich</option>
            <option value="GB">GB · United Kingdom</option>
            <option value="CH">CH · Schweiz</option>
            <option value="US">US · United States</option>
        </select>
    </div>
    <div class="col-12">
        <label class="form-label small mb-1" th:for="${prefix + '-name'}" th:text="#{tickets.customer.name}">Name or company</label>
        <input type="text" class="form-control" th:id="${prefix + '-name'}" maxlength="120" autocomplete="organization">
    </div>
    <div class="col-12">
        <label class="form-label small mb-1" th:for="${prefix + '-address'}" th:text="#{tickets.customer.address}">Address</label>
        <input type="text" class="form-control" th:id="${prefix + '-address'}" maxlength="200" autocomplete="street-address">
    </div>
</div>
</body>
</html>
