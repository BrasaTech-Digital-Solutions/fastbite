<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">

<head><link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{tableqr.title} + ' · FastBite'">Table QR codes · FastBite</title>
    <link rel="stylesheet" th:href="@{/css/table-qr.css}">
</head>

<body class="table-qr-page">
<svg th:replace="~{fastfood/fragments/guest :: icons}"></svg>
<div th:replace="~{fastfood/fragments/environment :: banner}"></div>
    <main class="qr-container">
        <div class="qr-header no-print">
            <h1 class="qr-heading">
                <svg class="icon" aria-hidden="true"><use href="#i-qrcode"></use></svg>
                <span th:text="#{tableqr.heading}">Table QR codes</span>
            </h1>
            <button type="button" class="qr-print-btn" id="printQrCodesBtn">
                <svg class="icon" aria-hidden="true"><use href="#i-print"></use></svg>
                <span th:text="#{tableqr.print}">Print</span>
            </button>
        </div>
        <p class="qr-instructions no-print" th:text="#{tableqr.instructions}">
            Put each code on its table. Guests who scan it order to that table; anyone else can only order takeaway.
        </p>
        <div class="qr-notice qr-notice-warning no-print" th:if="${localAddress}" role="note">
            <svg class="icon" aria-hidden="true"><use href="#i-warning"></use></svg>
            <span th:text="#{tableqr.local.warning}">These codes point at a local test address. Print them from the restaurant's public address instead.</span>
        </div>
        <div class="qr-notice qr-notice-info no-print" th:if="${#lists.isEmpty(codes)}" th:text="#{tableqr.empty}">There are no active tables.</div>

        <div class="qr-grid">
            <article class="qr-card" th:each="code : ${codes}">
                <h2 class="qr-card-title" th:text="${code.tableName}">Table 1</h2>
                <div class="qr-card-caption" th:text="#{qr.scan.to.order}">Scan to order</div>
                <div class="qr-code" th:data-url="${code.url}"></div>
                <div class="qr-url" th:text="${code.url}">https://...</div>
            </article>
        </div>
    </main>

    <script th:src="@{/js/qrcode.min.js}" defer></script>
    <script th:src="@{/js/table-qr.js}" defer></script>
</body>

</html>
