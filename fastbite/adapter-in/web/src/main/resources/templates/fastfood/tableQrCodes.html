<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head><link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table QR codes - FastBite</title>
    <link href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="/webjars/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .qr-card { break-inside: avoid; page-break-inside: avoid; }
        .qr-code svg { width: 100%; max-width: 220px; height: auto; }
        .qr-url { font-size: 0.65rem; word-break: break-all; }
        @media print {
            .no-print { display: none !important; }
            .qr-card { border: 1px solid #000 !important; }
        }
    </style>
</head>

<body class="bg-light">
<div th:replace="~{fastfood/fragments/environment :: banner}"></div>
    <div class="container py-4">
        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3 no-print">
            <h3 class="m-0"><i class="fas fa-qrcode me-2"></i>Table QR codes</h3>
            <button class="btn btn-primary" onclick="window.print()"><i class="fas fa-print me-1"></i> Print</button>
        </div>
        <p class="text-muted no-print">
            Put each code on its table. Guests who scan it order to that table; anyone else can only order takeaway.
        </p>
        <div class="alert alert-warning no-print" th:if="${localAddress}">
            <i class="fas fa-triangle-exclamation me-2"></i>
            These codes point at a local test address. Print them from the restaurant's public address instead.
        </div>
        <div class="alert alert-info no-print" th:if="${#lists.isEmpty(codes)}">There are no active tables.</div>

        <div class="row g-3">
            <div class="col-6 col-md-4 col-lg-3" th:each="code : ${codes}">
                <div class="card qr-card h-100 text-center p-3">
                    <h5 class="fw-bold mb-1" th:text="${code.tableName}">Table 1</h5>
                    <div class="small text-muted mb-2" th:text="#{qr.scan.to.order}">Scan to order</div>
                    <div class="qr-code mx-auto" th:data-url="${code.url}"></div>
                    <div class="qr-url text-muted mt-2" th:text="${code.url}">https://...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script>
        document.querySelectorAll('.qr-code').forEach(box => {
            const qr = qrcode(0, 'M'); // smallest size that fits, medium error correction
            qr.addData(box.dataset.url);
            qr.make();
            box.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
        });
    </script>
</body>

</html>
