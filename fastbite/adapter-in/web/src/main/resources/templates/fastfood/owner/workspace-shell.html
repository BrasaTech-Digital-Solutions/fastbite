<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><body>
<aside th:fragment="sidebar" class="workspace-sidebar">
<a class="brand" href="/owner/console?view=restaurants"><span class="brand-mark">f.</span>fastbite</a>
<th:block th:if="${workspaceArea != null && selected != null && workspaceArea != 'restaurants' && workspaceArea != 'billing' && workspaceArea != 'account'}">
<a class="workspace-back" href="/owner/console?view=restaurants" th:text="#{workspace.nav.back}" th:attr="aria-current=${workspaceArea=='restaurants' ? 'page' : null}">← My restaurants</a>
<div class="workspace-location-card"><strong th:text="${selected.tenantId}"></strong><small th:text="${selected.closed ? #messages.msg('workspace.status.closed') : (setup != null && (setup.sandbox() || setup.opened()) ? #messages.msg('workspace.status.open') : #messages.msg('workspace.status.preparing'))}"></small><a th:href="@{/{tenant}/menu(tenant=${selected.tenantId})}" th:text="${'/'+selected.tenantId+'/menu'}"></a></div>
<nav aria-label="Location" th:attr="aria-label=#{workspace.nav.location}">
<a th:href="@{/owner/console(view='today',location=${selected.tenantId})}" th:classappend="${workspaceArea=='today'}?'active'" th:text="${setup != null && !setup.sandbox() && !setup.opened() ? #messages.msg('workspace.nav.opening') : #messages.msg('workspace.nav.today')}" th:attr="aria-current=${workspaceArea=='today' ? 'page' : null}">Today</a>
<a th:href="@{/owner/console(view='menu',location=${selected.tenantId})}" th:classappend="${workspaceArea=='menu'}?'active'" th:text="#{workspace.nav.menu}" th:attr="aria-current=${workspaceArea=='menu' ? 'page' : null}">Menu &amp; tables</a>
<a th:href="@{/owner/console(view='team',location=${selected.tenantId})}" th:classappend="${workspaceArea=='team'}?'active'" th:text="#{workspace.nav.team}" th:attr="aria-current=${workspaceArea=='team' ? 'page' : null}">Team</a>
<a th:href="@{/owner/console(view='tickets',location=${selected.tenantId})}" th:classappend="${workspaceArea=='tickets'}?'active'" th:text="#{workspace.nav.tickets}" th:attr="aria-current=${workspaceArea=='tickets' ? 'page' : null}">Tickets &amp; VERI*FACTU</a>
<a th:href="@{/owner/console(view='location-config',location=${selected.tenantId})}" th:classappend="${workspaceArea=='location-config'}?'active'" th:text="#{workspace.nav.settings}" th:attr="aria-current=${workspaceArea=='location-config' ? 'page' : null}">Settings</a>
<a th:href="@{/owner/console(view='data',location=${selected.tenantId})}" th:classappend="${workspaceArea=='data'}?'active'" th:text="#{workspace.nav.data}" th:attr="aria-current=${workspaceArea=='data' ? 'page' : null}">Data</a>
</nav><a th:if="${platform != null && platform.practice() && !selected.closed}" class="button workspace-practice" th:href="@{/owner/sandbox(location=${selected.tenantId})}" target="_blank" rel="noopener" th:text="#{workspace.nav.practice}">Practise in the sandbox ↗</a>
</th:block>
<nav th:unless="${workspaceArea != null && selected != null && workspaceArea != 'restaurants' && workspaceArea != 'billing' && workspaceArea != 'account'}" th:attr="aria-label=#{workspace.nav.account}">
<a href="/owner/console?view=restaurants" th:classappend="${workspaceArea=='restaurants'}?'active'" th:text="#{workspace.nav.restaurants}" th:attr="aria-current=${workspaceArea=='restaurants' ? 'page' : null}">My restaurants</a>
<a th:href="${platform != null && platform.productionUrl() != null ? platform.productionUrl()+'/owner/console?view=billing' : '/owner/console?view=billing'}" th:classappend="${workspaceArea=='billing'}?'active'" th:target="${platform != null && platform.productionUrl() != null ? '_blank' : null}" th:rel="${platform != null && platform.productionUrl() != null ? 'noopener' : null}" th:text="${#messages.msg('workspace.nav.billing') + (platform != null && platform.productionUrl() != null ? ' ↗' : '')}" th:attr="aria-current=${workspaceArea=='billing' ? 'page' : null}">Billing</a>
<a th:href="${platform != null && platform.productionUrl() != null ? platform.productionUrl()+'/owner/console?view=account' : '/owner/console?view=account'}" th:classappend="${workspaceArea=='account'}?'active'" th:target="${platform != null && platform.productionUrl() != null ? '_blank' : null}" th:rel="${platform != null && platform.productionUrl() != null ? 'noopener' : null}" th:text="${#messages.msg('workspace.nav.account') + (platform != null && platform.productionUrl() != null ? ' ↗' : '')}" th:attr="aria-current=${workspaceArea=='account' ? 'page' : null}">Account</a>
</nav></aside>
<header th:fragment="topbar" class="workspace-topbar">
<a th:if="${workspaceArea != null && selected != null && workspaceArea != 'restaurants' && workspaceArea != 'billing' && workspaceArea != 'account'}" class="workspace-mobile-back" href="/owner/console?view=restaurants" th:text="#{workspace.nav.back}" th:attr="aria-current=${workspaceArea=='restaurants' ? 'page' : null}">← My restaurants</a>
<form method="get" action="/owner/console" class="location-switcher" th:if="${!#lists.isEmpty(locations)}"><input type="hidden" name="view" value="today"><label for="location-switch" th:text="#{workspace.nav.select}">Your location</label><div class="switch-row"><select id="location-switch" name="location"><option th:each="loc:${locations}" th:value="${loc.tenantId}" th:selected="${selected?.tenantId==loc.tenantId}" th:text="${loc.closed ? loc.tenantId + ' (' + (closedLabels != null ? closedLabels[loc.tenantId] : #messages.msg('workspace.status.closed')) + ')' : loc.tenantId}"></option></select><button class="quiet-button" type="submit" th:text="#{workspace.nav.open}">Open</button></div></form>
<span class="workspace-environment" th:if="${platform != null && !platform.sandbox()}" th:text="#{workspace.environment.production}">Production: everything here is real</span>
<div class="owner-account"><span th:text="${ownerUsername}">Owner</span><form th:action="@{/logout}" method="post"><button class="quiet-button" th:text="#{workspace.nav.signout}">Sign out</button></form></div></header>
<nav th:fragment="mobile-tabs" class="workspace-mobile-tabs" aria-label="Workspace" th:attr="aria-label=#{workspace.page.short}"><th:block th:if="${workspaceArea != null && selected != null && workspaceArea != 'restaurants' && workspaceArea != 'billing' && workspaceArea != 'account'}">
<a th:href="@{/owner/console(view='today',location=${selected.tenantId})}" th:text="${setup != null && !setup.sandbox() && !setup.opened() ? #messages.msg('workspace.nav.opening') : #messages.msg('workspace.nav.today')}" th:attr="aria-current=${workspaceArea=='today' ? 'page' : null}">Today</a><a th:href="@{/owner/console(view='menu',location=${selected.tenantId})}" th:text="#{workspace.nav.menu.short}" th:attr="aria-current=${workspaceArea=='menu' ? 'page' : null}">Menu</a><a th:href="@{/owner/console(view='team',location=${selected.tenantId})}" th:text="#{workspace.nav.team}" th:attr="aria-current=${workspaceArea=='team' ? 'page' : null}">Team</a><details><summary th:classappend="${workspaceArea=='tickets' || workspaceArea=='location-config' || workspaceArea=='data'} ? 'active'" th:attr="aria-current=${workspaceArea=='tickets' || workspaceArea=='location-config' || workspaceArea=='data' ? 'page' : null}" th:text="#{workspace.nav.more}">More</summary><div><a th:href="@{/owner/console(view='tickets',location=${selected.tenantId})}" th:text="#{workspace.nav.tickets}" th:attr="aria-current=${workspaceArea=='tickets' ? 'page' : null}">Tickets</a><a th:href="@{/owner/console(view='location-config',location=${selected.tenantId})}" th:text="#{workspace.nav.settings}" th:attr="aria-current=${workspaceArea=='location-config' ? 'page' : null}">Settings</a><a th:href="@{/owner/console(view='data',location=${selected.tenantId})}" th:text="#{workspace.nav.data}" th:attr="aria-current=${workspaceArea=='data' ? 'page' : null}">Data</a></div></details></th:block><th:block th:unless="${workspaceArea != null && selected != null && workspaceArea != 'restaurants' && workspaceArea != 'billing' && workspaceArea != 'account'}"><a href="/owner/console?view=restaurants" th:text="#{workspace.nav.restaurants}" th:attr="aria-current=${workspaceArea=='restaurants' ? 'page' : null}">My restaurants</a><a th:href="${platform != null && platform.productionUrl() != null ? platform.productionUrl()+'/owner/console?view=billing' : '/owner/console?view=billing'}" th:target="${platform != null && platform.productionUrl() != null ? '_blank' : null}" th:rel="${platform != null && platform.productionUrl() != null ? 'noopener' : null}" th:text="${#messages.msg('workspace.nav.billing') + (platform != null && platform.productionUrl() != null ? ' ↗' : '')}" th:attr="aria-current=${workspaceArea=='billing' ? 'page' : null}">Billing</a><a th:href="${platform != null && platform.productionUrl() != null ? platform.productionUrl()+'/owner/console?view=account' : '/owner/console?view=account'}" th:target="${platform != null && platform.productionUrl() != null ? '_blank' : null}" th:rel="${platform != null && platform.productionUrl() != null ? 'noopener' : null}" th:text="${#messages.msg('workspace.nav.account') + (platform != null && platform.productionUrl() != null ? ' ↗' : '')}" th:attr="aria-current=${workspaceArea=='account' ? 'page' : null}">Account</a></th:block></nav>
</body></html>
