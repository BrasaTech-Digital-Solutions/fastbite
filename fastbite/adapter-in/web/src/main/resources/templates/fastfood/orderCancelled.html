<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{message.order.cancelled.title}">Order cancelled</title>
    <link href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fastfood/fragments/environment :: banner}"></div>
<main class="container py-5">
    <h1 th:text="#{message.order.cancelled.title}">Order cancelled</h1>
    <p th:text="#{message.order.cancelled.help}">This order is no longer waiting for payment. Unpaid online takeaway orders expire after one hour. Please place a new order, or contact the restaurant if you already paid.</p>
    <a class="btn btn-primary" th:href="${tenantId != null && !tenantId.isEmpty()} ? @{/{tenantId}/menu(tenantId=${tenantId})} : '/menu'" th:text="#{button.back.to.menu}">Back to menu</a>
</main>
</body>
</html>
