<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fastfood/fragments/account :: layout(#{recovery.forgot}, #{recovery.forgot}, #{account.layout.recoveryLead}, ~{::section}, null, false)}"><body><section>
<div th:if="${sent}" class="account-alert account-success" role="status" th:text="#{recovery.sent}"></div><form th:unless="${sent}" th:action="@{/forgot-password(tenantId=${tenantId})}" method="post"><div class="field"><label for="identifier" th:text="#{recovery.identifier}"></label><input id="identifier" name="identifier" maxlength="254" required autocomplete="username"></div><button class="button" th:text="#{recovery.send}"></button></form><a class="account-link" th:href="@{/login(tenantId=${tenantId})}" th:text="#{recovery.back}"></a>
</section></body></html>
