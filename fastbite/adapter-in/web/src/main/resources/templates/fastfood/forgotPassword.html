<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="#{recovery.forgot}">Forgot password</title><link rel="stylesheet" href="/css/platform.css"></head><body><main class="panel"><h1 th:text="#{recovery.forgot}">Forgot password</h1><p th:if="${sent}" th:text="#{recovery.sent}"></p><form th:unless="${sent}" th:action="@{/forgot-password(tenantId=${tenantId})}" method="post"><label for="identifier" th:text="#{recovery.identifier}">Email or username</label><input id="identifier" name="identifier" maxlength="254" required autocomplete="username"><button th:text="#{recovery.send}">Send link</button></form><a th:href="@{/login(tenantId=${tenantId})}" th:text="#{recovery.back}">Back to login</a></main></body></html>
