<!DOCTYPE html>
<html th:attr="data-theme=${locationTheme != null ? locationTheme.id : 'fastfood'}" th:lang="${#locale.language}" lang="es" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">

<head><link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{label.order.number} + ' ' + (${orderNumber} ?: '') + ' · ' + (${restaurantName} ?: #{logo.title})">Order</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/restaurant.css}">

<link th:if="${locationTheme != null}" rel="stylesheet" th:href="${locationTheme.stylesheet()}"></head>

<body class="guest">
<svg th:replace="~{fastfood/fragments/guest :: icons}"></svg>
<div th:replace="~{fastfood/fragments/environment :: banner}"></div>
    <header th:replace="~{fastfood/fragments/guest :: topbar(page='confirmation')}"></header>

    <main class="container guest-main">
        <!-- Step Indicator -->
        <div class="step-indicator">
            <div class="step completed" id="step1">1</div>
            <div class="step completed" id="step2">2</div>
            <div class="step completed" id="step3">3</div>
            <div class="step completed" id="step4">4</div>
        </div>

        <!-- Success Section -->
        <div id="successSection" class="page-column page-column-narrow">
            <div class="confirmation-card confirmation-card-centered">
                <div class="confirmation-header">
                    <svg class="icon icon-5x is-success" aria-hidden="true"><use href="#i-check-circle"></use></svg>
                    <h2 class="success-title" id="order-success-title" th:hidden="${paymentPending}" th:text="#{message.order.submitted.successfully}">Order
                        Submitted Successfully!</h2>
                    <p class="muted" id="order-success-detail" th:hidden="${paymentPending}" th:text="#{message.thank.you.details}">Gracias por tu pedido. Lo
                        estamos preparando ya.</p>
                    <!-- Shown when the guest comes back from paying online -->
                    <div th:if="${paidOnline != null and !paymentPending}" class="notice payment-result" id="paymentResult"
                        th:classappend="${paidOnline} ? 'notice-success' : 'notice-warning'">
                        <svg class="icon" aria-hidden="true"><use th:href="${paidOnline} ? '#i-check-circle' : '#i-warning'" href="#i-check-circle"></use></svg>
                        <span th:text="${paidOnline} ? #{message.payment.received} : #{message.payment.not.confirmed}">Payment received</span>
                    </div>
                </div>

                <div class="order-number-block">
                    <p class="order-number-label" th:text="#{label.order.number}">Order
                        Number</p>
                    <h1 class="order-number" th:text="${orderNumber}" id="orderNumber">100</h1>
                </div>

                <!-- Live 4-Stage Visual Order Progress Bar (F-21) -->
                <section id="order-progress-card" th:hidden="${paymentPending}" class="tracker" data-stage="1"
                    aria-labelledby="trackerTitle">
                    <h2 class="tracker-title" id="trackerTitle"><svg class="icon is-danger" aria-hidden="true"><use href="#i-signal"></use></svg><span
                            th:text="#{guest.tracker.title}">Your order status</span></h2>

                    <div class="tracker-bar" role="progressbar" aria-valuemin="0" aria-valuemax="4" aria-valuenow="1"
                        aria-labelledby="trackerTitle">
                        <div id="liveOrderProgressBar" class="tracker-bar-fill"></div>
                    </div>

                    <ol class="tracker-stages">
                        <li class="tracker-stage stage-received" id="stage1Col">
                            <svg class="icon icon-2x" aria-hidden="true"><use href="#i-inbox"></use></svg> <span th:text="#{guest.tracker.received}">Received</span>
                        </li>
                        <li class="tracker-stage stage-cooking" id="stage2Col">
                            <svg class="icon icon-2x" aria-hidden="true"><use href="#i-fire"></use></svg> <span th:text="#{guest.tracker.cooking}">Cooking</span>
                        </li>
                        <li class="tracker-stage stage-ready" id="stage3Col">
                            <svg class="icon icon-2x" aria-hidden="true"><use href="#i-bell"></use></svg> <span th:text="#{guest.tracker.ready}">Ready</span>
                        </li>
                        <li class="tracker-stage stage-complete" id="stage4Col">
                            <svg class="icon icon-2x" aria-hidden="true"><use href="#i-check-double"></use></svg> <span th:text="#{guest.tracker.complete}">Complete</span>
                        </li>
                    </ol>
                </section>

                <section th:if="${guestTicketExpected}" id="guest-ticket" class="guest-ticket"
                         th:attr="data-pending=#{guest.ticket.pending},data-timeout=#{guest.ticket.timeout},data-label=#{guest.ticket.number}">
                    <p id="guest-ticket-status" role="status" th:text="#{guest.ticket.pending}">Preparing your ticket…</p>
                    <a id="guest-ticket-link" class="btn-pos-primary button-lg" hidden th:text="#{guest.ticket.open}">View and save your ticket</a>
                </section>

                <div class="button-stack button-stack-wide">
                    <a th:href="${!#strings.isEmpty(tenantId)} ? @{/{tenantId}/menu(tenantId=${tenantId})} : '/menu'" class="btn-pos-primary button-pill button-lg" id="startNewOrderBtn">
                        <svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg> <span
                            th:text="#{button.place.another.order}">Place Another Order</span>
                    </a>
                </div>
            </div>
        </div>
    </main>
    <script th:src="@{/js/live-updates.js}" defer></script>
    <script th:src="@{/js/order-progress.js}" defer></script>
    <script th:src="@{/js/guest-ticket.js}" defer></script>
</body>

</html>
