<!DOCTYPE html>
<html th:attr="data-theme=${locationTheme != null ? locationTheme.id : 'fastfood'}" lang="en" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">

<head><link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{page.title}">FastBite - Order Online</title>
    <link href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="/webjars/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

<link th:if="${locationTheme != null}" rel="stylesheet" th:href="${locationTheme.stylesheet()}"></head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-hamburger"></i> <span
                    th:text="#{logo.title}">FastBite</span></a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        <!-- Step Indicator -->
        <div class="step-indicator">
            <div class="step completed" id="step1">1</div>
            <div class="step completed" id="step2">2</div>
            <div class="step completed" id="step3">3</div>
            <div class="step completed" id="step4">4</div>
        </div>

        <!-- Success Section -->
        <div id="successSection">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="confirmation-card text-center">
                        <div class="confirmation-header">
                            <i class="fas fa-check-circle text-success fa-5x mb-3"></i>
                            <h2 class="text-success mb-2" th:text="#{message.order.submitted.successfully}">Order
                                Submitted Successfully!</h2>
                            <p class="text-muted" th:text="#{message.thank.you.details}">Gracias por tu pedido. Lo
                                estamos preparando ya.</p>
                            <!-- Shown when the guest comes back from paying online -->
                            <div th:if="${paidOnline != null}" class="alert mt-3 mb-0" id="paymentResult"
                                th:classappend="${paidOnline} ? 'alert-success' : 'alert-warning'">
                                <i class="fas me-2" th:classappend="${paidOnline} ? 'fa-circle-check' : 'fa-triangle-exclamation'"></i>
                                <span th:text="${paidOnline} ? #{message.payment.received} : #{message.payment.not.confirmed}">Payment received</span>
                            </div>
                        </div>

                        <div class="py-4">
                            <h6 class="text-muted text-uppercase fw-bold mb-2" th:text="#{label.order.number}">Order
                                Number</h6>
                            <h1 class="display-1 fw-bold text-dark" th:text="${orderNumber}" id="orderNumber"
                                style="font-size: 8rem;">100</h1>
                        </div>

                        <!-- Live 4-Stage Visual Order Progress Bar (F-21) -->
                        <div class="card mb-4 border-0 bg-light rounded-4 p-4 shadow-sm text-start">
                            <h6 class="fw-bold mb-3 text-dark text-center"><i class="fas fa-signal me-2 text-danger"></i>Live Kitchen Status Tracker</h6>
                            
                            <div class="progress mb-3" style="height: 12px; border-radius: 10px;">
                                <div id="liveOrderProgressBar" class="progress-bar bg-success progress-bar-striped progress-bar-animated" role="progressbar" style="width: 25%;"></div>
                            </div>

                            <div class="row text-center small fw-bold text-muted">
                                <div class="col-3" id="stage1Col">
                                    <i class="fas fa-inbox text-success fa-2x mb-1 d-block"></i> Received
                                </div>
                                <div class="col-3 opacity-50" id="stage2Col">
                                    <i class="fas fa-fire-burner text-warning fa-2x mb-1 d-block"></i> Cooking
                                </div>
                                <div class="col-3 opacity-50" id="stage3Col">
                                    <i class="fas fa-bell text-info fa-2x mb-1 d-block"></i> Ready
                                </div>
                                <div class="col-3 opacity-50" id="stage4Col">
                                    <i class="fas fa-check-double text-success fa-2x mb-1 d-block"></i> Complete
                                </div>
                            </div>
                        </div>

                        <div class="bg-light p-3 rounded-4 mb-4 border">
                            <p class="mb-0 text-muted">
                                <i class="fas fa-info-circle me-2"></i>
                                <span th:text="#{message.you.will.receive.a.confirmation.email.shortly}">You will
                                    receive a confirmation email shortly.</span>
                            </p>
                        </div>

                        <div class="d-grid gap-3">
                            <a th:href="${tenantId != null && !tenantId.isEmpty()} ? @{/{tenantId}/menu(tenantId=${tenantId})} : '/menu'" class="btn btn-pos-primary btn-lg rounded-pill" id="startNewOrderBtn">
                                <i class="fas fa-arrow-left me-2"></i> <span
                                    th:text="#{button.place.another.order}">Place Another Order</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>


        // Live Order Progress Tracker JS (F-21)
        const FINISHED_STATUSES = ['COMPLETE', 'CANCELLED'];

        function getTenantPrefix() {
            const path = window.location.pathname;
            const segments = path.split('/');
            if (segments.length > 1) {
                const firstSegment = segments[1];
                const reserved = ["signup", "login", "css", "js", "images", "webjars", "stripe", "error", "favicon.ico", "actuator", "api", "counter", "backoffice", "dashboard", "logout", "menu", "select-payment", "order-confirmation", ".well-known", "appspecific"];
                if (firstSegment && !reserved.includes(firstSegment)) {
                    return '/' + firstSegment;
                }
            }
            return '';
        }

        function startOrderProgressPolling() {
            let eventSource = null;
            let fallbackTimer = null;
            const orderStatusUrl = getTenantPrefix() + '/api/order-status';
            const sseUrl = getTenantPrefix() + '/api/order-status/live';

            const pollOnce = () => {
                fetch(orderStatusUrl)
                    .then(res => res.ok ? res.json() : null)
                    .then(order => {
                        if (!order) return;
                        updateProgressTracker(order.status);
                        if (FINISHED_STATUSES.includes(order.status) && fallbackTimer) {
                            clearInterval(fallbackTimer);
                        }
                    })
                    .catch(err => console.error('Order status poll error:', err));
            };

            // Immediate initial poll
            pollOnce();

            if (window.EventSource) {
                try {
                    eventSource = new EventSource(sseUrl);
                    eventSource.addEventListener('order-update', (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            if (data && data.status) {
                                updateProgressTracker(data.status);
                                if (FINISHED_STATUSES.includes(data.status)) {
                                    eventSource.close();
                                }
                            }
                        } catch (e) {
                            console.error('Failed to parse order-update event', e);
                        }
                    });

                    eventSource.onerror = () => {
                        if (!fallbackTimer) {
                            fallbackTimer = setInterval(pollOnce, 5000);
                        }
                    };
                    return;
                } catch (e) {
                    console.warn('SSE initialization failed, fallback to poll', e);
                }
            }

            fallbackTimer = setInterval(pollOnce, 5000);
        }

        function updateProgressTracker(status) {
            const bar = document.getElementById('liveOrderProgressBar');
            const s1 = document.getElementById('stage1Col');
            const s2 = document.getElementById('stage2Col');
            const s3 = document.getElementById('stage3Col');
            const s4 = document.getElementById('stage4Col');

            if (!bar) return;

            if (s1) s1.classList.add('opacity-50');
            if (s2) s2.classList.add('opacity-50');
            if (s3) s3.classList.add('opacity-50');
            if (s4) s4.classList.add('opacity-50');

            if (status === 'CREATED' || status === 'ACCEPTED') {
                bar.style.width = '25%';
                if (s1) s1.classList.remove('opacity-50');
            } else if (status === 'PROCESSING') {
                bar.style.width = '50%';
                if (s1) s1.classList.remove('opacity-50');
                if (s2) s2.classList.remove('opacity-50');
            } else if (status === 'DONE' || status === 'DELIVERED') {
                bar.style.width = '75%';
                if (s1) s1.classList.remove('opacity-50');
                if (s2) s2.classList.remove('opacity-50');
                if (s3) s3.classList.remove('opacity-50');
            } else if (status === 'COMPLETE') {
                bar.style.width = '100%';
                if (s1) s1.classList.remove('opacity-50');
                if (s2) s2.classList.remove('opacity-50');
                if (s3) s3.classList.remove('opacity-50');
                if (s4) s4.classList.remove('opacity-50');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            startOrderProgressPolling();
        });
    </script>
</body>

</html>
