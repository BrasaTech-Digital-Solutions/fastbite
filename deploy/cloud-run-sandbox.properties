# FastBite - Cloud Run service "fastbite-sandbox" (SANDBOX), region europe-southwest1
# Public URL: https://sandbox.fastbite.brasatech.es (through Firebase Hosting)
#
# Plain variables: set them as environment variables on the service.
# Lines marked [SECRET]: create the value in Secret Manager and reference it from the service.
# Never put a real secret value in this file.
#
# Do NOT set: PORT (Cloud Run injects it), FASTBITE_VERSION (baked into the image),
#             FASTBITE_COOKIE_DOMAIN (must stay unset), GCS_BUCKET / GCS_OAUTH_TOKEN (storage is the /storage mount),
#             STRIPE_RESTAURANT_PRICE_ID / STRIPE_PLATFORM_WEBHOOK_SECRET (subscriptions live in production only).
#
# Service settings (not variables): memory 512Mi, cpu 1, max instances 3, request timeout 300s,
#   allow unauthenticated, volume: GCS bucket fastbite-sandbox-storage mounted at /storage.

# --- Environment ---
FASTBITE_ENVIRONMENT=sandbox
FASTBITE_PUBLIC_URL=https://sandbox.fastbite.brasatech.es
FASTBITE_STANDALONE=false

# --- Link to production ---
FASTBITE_LINK_URL=https://fastbite.brasatech.es
# How this server reaches production; production's run.app URL avoids going through Firebase.
FASTBITE_LINK_INTERNAL_URL=https://fastbite-<PROJECT_HASH>.europe-southwest1.run.app
# [SECRET] the SAME secret as on production. Secret Manager: fastbite-link-secret
FASTBITE_LINK_SECRET=<secret: fastbite-link-secret>

# --- Database (same Cloud SQL micro instance, its own database) ---
DB_URL=jdbc:postgresql://<CLOUD_SQL_HOST>:5432/fastbite_sandbox
DB_USER=<db user>
# [SECRET] Secret Manager: fastbite-sandbox-db-password (may be the same user/password as production)
DB_PASSWORD=<secret: fastbite-sandbox-db-password>
DB_DRIVER=org.postgresql.Driver
DB_POOL_MAX_SIZE=2
DB_POOL_MIN_IDLE=1
MIGRATION_MODE=validate
H2_CONSOLE_ENABLED=false

# --- Session cookie (Firebase Hosting forwards only __session) ---
FASTBITE_SESSION_COOKIE=__session

# --- Files (GCS bucket mounted at /storage) ---
IMAGE_UPLOAD_DIR=/storage/images

# --- Background jobs (Cloud Scheduler calls POST /internal/jobs/run) ---
FASTBITE_JOBS_IN_PROCESS=false
# [SECRET] the sandbox's own value (different from production), also sent by its Cloud Scheduler job.
FASTBITE_JOBS_SECRET=<secret: fastbite-sandbox-jobs-secret>

# --- Table QR codes ---
# [SECRET] the sandbox's own value (different from production).
TABLE_QR_SECRET=<secret: fastbite-sandbox-table-qr-secret>

# --- Email ---
SMTP_HOST=smtp.office365.com
SMTP_PORT=587
SMTP_USER=info@brasatech.es
# [SECRET] Secret Manager: fastbite-smtp-password
SMTP_PASSWORD=<secret: fastbite-smtp-password>
SMTP_AUTH=true
SMTP_STARTTLS=true

# --- Stripe (ALWAYS test mode in the sandbox) ---
# [SECRET] sk_test_...
STRIPE_SECRET_KEY=<secret: fastbite-sandbox-stripe-secret-key>
# [SECRET] signing secret of the sandbox's Connect webhook endpoint https://sandbox.fastbite.brasatech.es/api/webhooks/stripe
STRIPE_CONNECT_WEBHOOK_SECRET=<secret: fastbite-sandbox-stripe-connect-webhook-secret>
# The platform's TEST connected account: sandbox locations without their own account pay into it.
STRIPE_CONNECTED_ACCOUNT=acct_<test account id>

# --- VERI*FACTU (training records go to the AEAT TEST environment only) ---
# Optional: without a certificate, training records just stay pending.
VERIFACTU_CERTIFICATE_PATH=/secrets/verifactu/certificate.p12
# [SECRET] Secret Manager: fastbite-verifactu-certificate-password
VERIFACTU_CERTIFICATE_PASSWORD=<secret: fastbite-verifactu-certificate-password>
# Must stay false in the sandbox.
VERIFACTU_PRODUCTION_ENABLED=false
VERIFACTU_SEAL_CERTIFICATE=false
VERIFACTU_ISSUERS=<NIF1,NIF2>

# --- Legal pages ---
LEGAL_REGISTRY=Registro Mercantil de Alicante, tomo <..>, folio <..>, hoja <..>, inscripción <..>
LEGAL_WEBSITE=https://fastbite.brasatech.es

# --- Orders ---
ORDERS_TIME_ZONE=Europe/Madrid

# =====================================================================================
# Cloud Run JOB "fastbite-sandbox-migrate" (runs before each deploy; args: --migration-job)
# Same image, 1 CPU / 512Mi. Only these variables:
#   DB_URL=jdbc:postgresql://<CLOUD_SQL_HOST>:5432/fastbite_sandbox
#   DB_USER=<db user>
#   DB_PASSWORD=<secret: fastbite-sandbox-db-password>
#   DB_DRIVER=org.postgresql.Driver
#
# Cloud Scheduler job "fastbite-sandbox-jobs": every minute (* * * * *), POST
#   https://fastbite-sandbox-<PROJECT_HASH>.europe-southwest1.run.app/internal/jobs/run
#   header X-FastBite-Jobs-Secret: <value of fastbite-sandbox-jobs-secret>, attempt deadline 300s.
