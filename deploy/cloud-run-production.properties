# FastBite - Cloud Run service "fastbite" (PRODUCTION), region europe-southwest1
# Public URL: https://fastbite.brasatech.es (through Firebase Hosting)
#
# Plain variables: set them as environment variables on the service.
# Lines marked [SECRET]: create the value in Secret Manager and reference it from the service
#   (Cloud Run > Edit > Variables & Secrets > Reference a secret, or --set-secrets NAME=secret-name:latest).
# Never put a real secret value in this file.
#
# Do NOT set: PORT (Cloud Run injects it), FASTBITE_VERSION (baked into the image),
#             FASTBITE_COOKIE_DOMAIN (must stay unset), GCS_BUCKET / GCS_OAUTH_TOKEN (storage is the /storage mount).
#
# Service settings (not variables): memory 512Mi, cpu 1, max instances 3, request timeout 300s,
#   allow unauthenticated, volume: GCS bucket fastbite-production-storage mounted at /storage.

# --- Environment ---
FASTBITE_ENVIRONMENT=production
FASTBITE_PUBLIC_URL=https://fastbite.brasatech.es
FASTBITE_STANDALONE=false

# --- Link to the sandbox (production refuses to start without it) ---
FASTBITE_LINK_URL=https://sandbox.fastbite.brasatech.es
# How this server reaches the sandbox; the sandbox service's run.app URL avoids going through Firebase.
FASTBITE_LINK_INTERNAL_URL=https://fastbite-sandbox-<PROJECT_HASH>.europe-southwest1.run.app
# [SECRET] at least 32 characters; the SAME secret as on the sandbox. Secret Manager: fastbite-link-secret
FASTBITE_LINK_SECRET=<secret: fastbite-link-secret>

# --- Database (Cloud SQL micro, PostgreSQL 16) ---
# The image has no Cloud SQL connector: reach the instance over TCP (private IP via VPC egress,
# or public IP with SSL). Use the host your current service already uses.
DB_URL=jdbc:postgresql://<CLOUD_SQL_HOST>:5432/fastbite_production
DB_USER=<db user>
# [SECRET] Secret Manager: fastbite-production-db-password
DB_PASSWORD=<secret: fastbite-production-db-password>
DB_DRIVER=org.postgresql.Driver
DB_POOL_MAX_SIZE=2
DB_POOL_MIN_IDLE=1
# The migration job migrates; the service only validates the schemas.
MIGRATION_MODE=validate
H2_CONSOLE_ENABLED=false

# --- Session cookie (Firebase Hosting forwards only __session) ---
FASTBITE_SESSION_COOKIE=__session

# --- Files (GCS bucket mounted at /storage) ---
IMAGE_UPLOAD_DIR=/storage/images

# --- Background jobs (Cloud Scheduler calls POST /internal/jobs/run) ---
FASTBITE_JOBS_IN_PROCESS=false
# [SECRET] at least 32 characters; production's own value, also sent by its Cloud Scheduler job.
FASTBITE_JOBS_SECRET=<secret: fastbite-production-jobs-secret>

# --- Table QR codes ---
# [SECRET] production's own value; NEVER change it once QR codes are printed.
TABLE_QR_SECRET=<secret: fastbite-production-table-qr-secret>

# --- Email ---
SMTP_HOST=smtp.office365.com
SMTP_PORT=587
SMTP_USER=info@brasatech.es
# [SECRET] Secret Manager: fastbite-smtp-password
SMTP_PASSWORD=<secret: fastbite-smtp-password>
SMTP_AUTH=true
SMTP_STARTTLS=true

# --- Stripe (production: LIVE keys when you go live; test keys until then) ---
# [SECRET] sk_live_... (or sk_test_... before going live)
STRIPE_SECRET_KEY=<secret: fastbite-production-stripe-secret-key>
# [SECRET] signing secret of the Connect/restaurant webhook endpoint https://fastbite.brasatech.es/api/webhooks/stripe
STRIPE_CONNECT_WEBHOOK_SECRET=<secret: fastbite-production-stripe-connect-webhook-secret>
# [SECRET] signing secret of the PLATFORM webhook endpoint (subscriptions), same URL, separate destination
STRIPE_PLATFORM_WEBHOOK_SECRET=<secret: fastbite-production-stripe-platform-webhook-secret>
# The EUR 49/month Restaurant price (docs/subscriptions.md)
STRIPE_RESTAURANT_PRICE_ID=price_<id>
STRIPE_AUTOMATIC_TAX_ENABLED=false
# Leave EMPTY in production: restaurants without their own account keep payments on the platform.
STRIPE_CONNECTED_ACCOUNT=

# --- VERI*FACTU (real records to the AEAT) ---
# Certificate: store the .p12/.pfx in Secret Manager and MOUNT it as a file volume (e.g. at /secrets/verifactu).
VERIFACTU_CERTIFICATE_PATH=/secrets/verifactu/certificate.p12
# [SECRET] Secret Manager: fastbite-verifactu-certificate-password
VERIFACTU_CERTIFICATE_PASSWORD=<secret: fastbite-verifactu-certificate-password>
# false until the go-live with the AEAT is decided; while false, real records stay pending.
VERIFACTU_PRODUCTION_ENABLED=false
VERIFACTU_SEAL_CERTIFICATE=false
# Comma-separated NIFs the certificate may submit for (own NIF, apoderamiento or colaboración social). Empty = every NIF is sent.
VERIFACTU_ISSUERS=<NIF1,NIF2>
# The declaración responsable is signed per release (scripts/sign-declaration.sh) and ships in the image.

# --- Legal pages (the defaults in application.yml are Brasatech's real details; set these only to change them) ---
LEGAL_WEBSITE=https://fastbite.brasatech.es

# --- Orders ---
ORDERS_TIME_ZONE=Europe/Madrid

# =====================================================================================
# Cloud Run JOB "fastbite-migrate" (runs before each deploy; args: --migration-job)
# Same image, 1 CPU / 512Mi. Only these variables:
#   DB_URL=jdbc:postgresql://<CLOUD_SQL_HOST>:5432/fastbite_production
#   DB_USER=<db user>
#   DB_PASSWORD=<secret: fastbite-production-db-password>
#   DB_DRIVER=org.postgresql.Driver
#
# Cloud Scheduler job "fastbite-jobs": every minute (* * * * *), POST
#   https://fastbite-<PROJECT_HASH>.europe-southwest1.run.app/internal/jobs/run
#   header X-FastBite-Jobs-Secret: <value of fastbite-production-jobs-secret>, attempt deadline 300s.
