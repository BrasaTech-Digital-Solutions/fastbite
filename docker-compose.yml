# The platform on one machine, as on the server: production and the sandbox side by side. Both run
# the same image, built once, each with its own database, storage and session cookie. Restaurants
# set up in the sandbox are promoted to production with a production bundle, which production only
# accepts from its own version.
#
#   docker compose up --build        (optional settings: copy docker/local.env.example to .env)
#
#   Proxy (Firebase-like)  http://fastbite.localhost:8088
#                          http://sandbox.fastbite.localhost:8088
#   Production (direct)    http://localhost:8090   restaurants at http://<location>.localhost:8090
#   Sandbox (direct)       http://localhost:8091   restaurants at http://<location>.localhost:8091
#   Email                  http://localhost:8027   (mail from both environments)
#
# Each environment migrates its database with the migration job before it starts, as on the server.

x-image: &image
  image: fastbite:${FASTBITE_VERSION:-local}

x-database: &database
  DB_USER: fastbite
  DB_PASSWORD: fastbite
  DB_DRIVER: org.postgresql.Driver
  HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect

x-app: &app
  # The migration job has run; the application only checks the schemas
  MIGRATION_MODE: validate
  H2_CONSOLE_ENABLED: "false"
  PORT: "8080"
  IMAGE_UPLOAD_DIR: /storage/images
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_AUTH: "false"
  SMTP_STARTTLS: "false"
  # Background jobs run through the scheduler service, as through Cloud Scheduler on Cloud Run
  FASTBITE_JOBS_IN_PROCESS: "false"
  FASTBITE_JOBS_SECRET: ${FASTBITE_JOBS_SECRET:-local-jobs-secret-for-docker-compose-only}
  # Stripe test mode in both: real payments never run on a laptop
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET:-}
  STRIPE_CONNECTED_ACCOUNT: ${STRIPE_CONNECTED_ACCOUNT:-}

services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${FASTBITE_PROXY_PORT:-8088}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - production
      - sandbox

  postgres:
    image: postgres:16.9
    command: ["postgres", "-c", "max_connections=25"]
    environment:
      POSTGRES_USER: fastbite
      POSTGRES_PASSWORD: fastbite
      POSTGRES_DB: fastbite
    ports:
      - "${FASTBITE_DB_PORT:-5434}:5432"
    volumes:
      - postgres16-environments:/var/lib/postgresql/data
      # Creates one database per environment the first time the volume is used
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastbite -d fastbite_sandbox"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${FASTBITE_MAIL_UI_PORT:-8027}:8025"

  migrate-production:
    <<: *image
    build:
      context: .
      dockerfile: docker/Dockerfile-Multi-Stage
      args:
        FASTBITE_VERSION: ${FASTBITE_VERSION:-local}
    command: ["--migration-job"]
    environment:
      <<: *database
      DB_URL: jdbc:postgresql://postgres:5432/fastbite_production
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  migrate-sandbox:
    <<: *image
    pull_policy: never
    command: ["--migration-job"]
    environment:
      <<: *database
      DB_URL: jdbc:postgresql://postgres:5432/fastbite_sandbox
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      migrate-production:
        condition: service_completed_successfully

  production:
    <<: *image
    pull_policy: never
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    ports:
      - "${FASTBITE_PRODUCTION_PORT:-8090}:8080"
    environment:
      <<: [*database, *app]
      FASTBITE_ENVIRONMENT: production
      FASTBITE_SESSION_COOKIE: __session
      DB_URL: jdbc:postgresql://postgres:5432/fastbite_production
      FASTBITE_PUBLIC_URL: http://fastbite.localhost:${FASTBITE_PROXY_PORT:-8088}
      TABLE_QR_SECRET: ${PRODUCTION_TABLE_QR_SECRET:-local-production-table-secret}
      # Linked to the sandbox: browsers reach it on this machine, the servers inside the compose network
      FASTBITE_LINK_URL: http://sandbox.fastbite.localhost:${FASTBITE_PROXY_PORT:-8088}
      FASTBITE_LINK_INTERNAL_URL: http://sandbox:8080
      FASTBITE_LINK_SECRET: ${FASTBITE_LINK_SECRET:-local-link-secret-for-docker-compose-only}
      # Never sends to the AEAT's production environment from a laptop
      VERIFACTU_PRODUCTION_ENABLED: "false"
    volumes:
      - production-storage:/storage
    depends_on:
      migrate-production:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  sandbox:
    <<: *image
    pull_policy: never
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    ports:
      - "${FASTBITE_SANDBOX_PORT:-8091}:8080"
    environment:
      <<: [*database, *app]
      FASTBITE_ENVIRONMENT: sandbox
      FASTBITE_SESSION_COOKIE: __session
      DB_URL: jdbc:postgresql://postgres:5432/fastbite_sandbox
      FASTBITE_PUBLIC_URL: http://sandbox.fastbite.localhost:${FASTBITE_PROXY_PORT:-8088}
      TABLE_QR_SECRET: ${SANDBOX_TABLE_QR_SECRET:-local-sandbox-table-secret}
      FASTBITE_LINK_URL: http://fastbite.localhost:${FASTBITE_PROXY_PORT:-8088}
      FASTBITE_LINK_INTERNAL_URL: http://production:8080
      FASTBITE_LINK_SECRET: ${FASTBITE_LINK_SECRET:-local-link-secret-for-docker-compose-only}
      # Training records go to the AEAT test environment when a certificate is in docker/secrets
      VERIFACTU_CERTIFICATE_PATH: ${SANDBOX_VERIFACTU_CERTIFICATE_PATH:-}
      VERIFACTU_CERTIFICATE_PASSWORD: ${VERIFACTU_CERTIFICATE_PASSWORD:-}
      VERIFACTU_ISSUERS: ${VERIFACTU_ISSUERS:-}
    volumes:
      - sandbox-storage:/storage
      - ./docker/secrets:/secrets:ro
    depends_on:
      migrate-sandbox:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  scheduler:
    image: curlimages/curl:8.12.1
    environment:
      FASTBITE_JOBS_SECRET: ${FASTBITE_JOBS_SECRET:-local-jobs-secret-for-docker-compose-only}
      FASTBITE_SCHEDULER_INTERVAL: ${FASTBITE_SCHEDULER_INTERVAL:-60}
    command:
      - sh
      - -c
      - |
        sleep 15
        while true; do
          for target in production sandbox; do
            rm -f /tmp/jobs.json
            code=$$(curl -s -o /tmp/jobs.json -w '%{http_code}' -m 270 -X POST \
              -H "X-FastBite-Jobs-Secret: $$FASTBITE_JOBS_SECRET" \
              "http://$$target:8080/internal/jobs/run" || true)
            echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) $$target /internal/jobs/run -> $${code:-000} $$(cat /tmp/jobs.json 2>/dev/null || true)"
          done
          sleep "$${FASTBITE_SCHEDULER_INTERVAL:-60}"
        done
    depends_on:
      production:
        condition: service_started
      sandbox:
        condition: service_started

volumes:
  postgres16-environments:
  production-storage:
  sandbox-storage:
