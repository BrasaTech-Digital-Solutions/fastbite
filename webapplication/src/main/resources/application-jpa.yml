# Profile: JPA (H2/PostgreSQL)
# Uses JPA with relational database
# Default: H2 file-based database (./data/fast_bite.db)
#DB_URL: jdbc:h2:file:./data/fast_bite.db
#DB_USER: sa
#DB_PASSWORD:
#DB_DRIVER: org.h2.Driver
#HIBERNATE_DIALECT: org.hibernate.dialect.H2Dialect

# For PostgreSQL, use these environment variables:
#DB_URL: jdbc:postgresql://localhost:5432/fast_bite
#DB_USER: myuser
#DB_PASSWORD: secret
#DB_DRIVER: org.postgresql.Driver
#HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect

spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/fast_bite.db}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:2}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
  sql:
    init:
      # Schemas are versioned by Flyway; demo content comes from kebab_demo.zip.
      mode: never
  jpa:
    database-platform: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: none
    show-sql: false
    defer-datasource-initialization: false
    properties:
      jakarta.persistence.jdbc.url: ${DB_URL:jdbc:h2:file:./data/fast_bite.db}
      jakarta.persistence.jdbc.user: ${DB_USER:sa}
      jakarta.persistence.jdbc.password: ${DB_PASSWORD:}
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
        format_sql: true
        temp:
          use_jdbc_metadata_defaults: false
        multi_tenancy: SCHEMA
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
fastbite.migrations.mode: ${MIGRATION_MODE:migrate}
