server.port: 8080

fastbite.protocol: ${PROTOCOL:http}

spring:
  profiles:
    active: jpa
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/fast_bite.db}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 30
  sql:
    init:
      # Schemas are versioned by Flyway; demo content comes from kebab_demo.zip.
      mode: never
  jpa:
    # One database session per service call, not per web request. A request-long session stays on the
    # schema the request started with, so work for another restaurant (Stripe webhooks, the owner
    # console) would silently run in the wrong schema. It also gives connections back sooner.
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
    defer-datasource-initialization: false
    properties:
      jakarta.persistence.jdbc.url: ${DB_URL:jdbc:h2:file:./data/fast_bite.db}
      jakarta.persistence.jdbc.user: ${DB_USER:sa}
      jakarta.persistence.jdbc.password: ${DB_PASSWORD:}
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        temp:
          use_jdbc_metadata_defaults: false
        multi_tenancy: SCHEMA
        # Loads lazy collections (e.g. each product's customizations) in batches instead of one query per row
        default_batch_fetch_size: 50
  session:
    jdbc:
      # Created by the platform migration (V2). Named with its schema: connections handed back by a
      # restaurant request can still point at that restaurant's schema.
      table-name: PUBLIC.SPRING_SESSION
      initialize-schema: never
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  application:
    name: fastbite
  messages:
    basename: i18n/messages
  mail:
    host: ${SMTP_HOST:smtp.office365.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:info@brasatech.es}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000
          starttls:
            enable: ${SMTP_STARTTLS:true}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

company:
  host: https://soberana.brasatech.es
  mail:
    to: ricardo.maximino@brasatech.es
    template:
      mail-validation: email/fastbite-email-validation.html
      product-delivery: email/fastbite-product-delivery.html
    attachment: static/attachments/Test.pdf

logging:
  level:
    root: INFO
    es.brasatech: DEBUG
    org.springframework: INFO

# Internationalization configuration
i18n:
  # Default language for storing entity values
  # All entity text fields (name, description, etc.) are stored in this language
  # Translations for other languages are stored in separate translation tables
  default-language: en

  # Supported locales for translation UI
  # Add or remove languages as needed
  supported-locales:
    - en
    - es
    - pt

# Image upload configuration
image:
  upload:
    # Directory where user-uploaded images will be stored
    # Can be absolute path or relative to application directory
    directory: ${IMAGE_UPLOAD_DIR:uploads/images}
    # Maximum file size (in MB)
    max-file-size: 5
    # Allowed extensions
    allowed-extensions: jpg,jpeg,png,gif,webp

# Cloud Storage configuration
fastbite:
  storage:
    cloud:
      bucket: ${GCS_BUCKET:}
      public-url: ${GCS_PUBLIC_URL:https://storage.googleapis.com}
  # Trusted origin for emailed setup links; HTTPS in production. Never derived from request headers.
  public-url: ${FASTBITE_PUBLIC_URL:http://localhost:8080}
  # sandbox or production. The sandbox issues training tickets with no fiscal value; set
  # FASTBITE_ENVIRONMENT=production only on the deployment where restaurants trade for real.
  environment: ${FASTBITE_ENVIRONMENT:sandbox}
  # The FastBite version running. Release images bake it in (FASTBITE_VERSION), so the sandbox and
  # production report the same one when they run the same image; production only imports promotion
  # bundles exported by the same version.
  version: ${FASTBITE_VERSION:@project.version@}
  # The billing software as VERI*FACTU records name it (SistemaInformatico). The producer signs the
  # declaración responsable of each version.
  verifactu:
    producer-name: ${VERIFACTU_PRODUCER_NAME:BRASATECH DIGITAL SOLUTIONS S.L.}
    producer-nif: ${VERIFACTU_PRODUCER_NIF:B09767898}
    system-name: FastBite
    system-id: FB
    version: ${VERIFACTU_SYSTEM_VERSION:1.0}
    operation-description: Servicios de restauración
    # The declaración responsable shown at /verifactu/declaracion-responsable. It reads as a draft
    # until it is marked signed and every detail is filled in.
    producer-address: ${VERIFACTU_PRODUCER_ADDRESS:Calle Ganaderos, 24, 03130 Santa Pola (Alicante), España}
    declaration-place: ${VERIFACTU_DECLARATION_PLACE:Santa Pola - Alicante}
    declaration-date: ${VERIFACTU_DECLARATION_DATE:}
    declaration-signed: ${VERIFACTU_DECLARATION_SIGNED:false}
    # How often pending billing records are sent once a submitter is configured
    submit-delay: PT1M
    # Direct connection to the AEAT. Nothing is sent until a certificate is set; the sandbox only
    # uses the AEAT test environment, and production stays closed until production-enabled is true.
    aeat:
      certificate-path: ${VERIFACTU_CERTIFICATE_PATH:}
      certificate-password: ${VERIFACTU_CERTIFICATE_PASSWORD:}
      # true for a seal certificate (certificado de sello), which uses the AEAT's www10/prewww10 hosts
      seal-certificate: ${VERIFACTU_SEAL_CERTIFICATE:false}
      production-enabled: ${VERIFACTU_PRODUCTION_ENABLED:false}
      # Comma-separated NIFs the certificate may send for; empty sends every location's records
      issuers: ${VERIFACTU_ISSUERS:}
  table:
    # Signs the QR codes printed on tables. Set TABLE_QR_SECRET in production before printing any:
    # changing it later makes every printed code stop working.
    secret: ${TABLE_QR_SECRET:local-development-only-table-secret}
  session:
    # Each environment has its own session cookie (FASTBITE_SESSION, FASTBITE_SANDBOX_SESSION), so signing in
    # to one never signs anyone out of the other. Set the platform's own domain (e.g. fastbite.brasatech.es)
    # so the cookie is shared by its restaurant subdomains and no other site of the company domain.
    cookie-name: ${FASTBITE_SESSION_COOKIE:}
    cookie-domain: ${FASTBITE_COOKIE_DOMAIN:}
  orders:
    # Order numbers restart at 1 at midnight in this time zone
    time-zone: ${ORDERS_TIME_ZONE:Europe/Madrid}

stripe:
  restaurant-price-id: ${STRIPE_RESTAURANT_PRICE_ID:}
  automatic-tax: ${STRIPE_AUTOMATIC_TAX_ENABLED:false}
  platform:
    webhook:
      secret: ${STRIPE_PLATFORM_WEBHOOK_SECRET:}
  secret:
    key: ${STRIPE_SECRET_KEY:${STRIPE_SECRET_KEY_SANDBOX:}}
  webhook:
    # Signing secret of the Stripe webhook endpoint that calls /api/webhooks/stripe
    secret: ${STRIPE_CONNECT_WEBHOOK_SECRET:${STRIPE_CONNECT_WEBHOOK_SECRET_SANDBOX:}}
  # Order payments of restaurants that have not connected their own Stripe account go to this one.
  # Leave it empty in production to keep those payments on the platform account.
  connected-account: ${STRIPE_CONNECTED_ACCOUNT:}
fastbite.migrations.mode: ${MIGRATION_MODE:migrate}
