# Extract only the __session cookie, mimicking Firebase Hosting behavior.
# Firebase forwards ONLY the cookie named __session to Cloud Run.
map $http_cookie $session_cookie {
    default "";
    "~(?:^|;\s*)__session=([^;]+)" "__session=$1";
}

# Resolve backend service names dynamically using Docker's internal DNS resolver
resolver 127.0.0.11 valid=1s ipv6=off;

# Reject unknown hosts with 404 (Firebase Hosting only answers configured domains)
server {
    listen 80 default_server;
    server_name _;
    return 404;
}

server {
    listen 80;
    server_name ~^fastbite\.localhost$;
    client_max_body_size 32m;

    location / {
        set $backend http://production:8080;
        proxy_pass $backend;

        # Do not set Host: let nginx send internal host (production:8080) like Cloud Run receives *.run.app
        # Overwrite client forwarded headers to mimic Firebase edge
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Strip all cookies except __session
        proxy_set_header Cookie $session_cookie;

        # Firebase Hosting terminates requests at 60s
        proxy_read_timeout 60s;

        # Keep default buffering on so SSE buffering mirrors Firebase / Cloud Run
        proxy_buffering on;
    }
}

server {
    listen 80;
    server_name ~^sandbox\.fastbite\.localhost$;
    client_max_body_size 32m;

    location / {
        set $backend http://sandbox:8080;
        proxy_pass $backend;

        # Do not set Host: let nginx send internal host (sandbox:8080) like Cloud Run receives *.run.app
        # Overwrite client forwarded headers to mimic Firebase edge
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Strip all cookies except __session
        proxy_set_header Cookie $session_cookie;

        # Firebase Hosting terminates requests at 60s
        proxy_read_timeout 60s;

        # Keep default buffering on so SSE buffering mirrors Firebase / Cloud Run
        proxy_buffering on;
    }
}
